<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LexiBridge AI | Bilingual Course Knowledge Alignment</title>
  <script src="./js/config.js"></script>
  <script src="./js/formal-workflow.js"></script>
  <style>
    :root {
      --navy: #07172c;
      --navy-2: #0c2642;
      --blue: #0f6f8f;
      --cyan: #1bb7d8;
      --gold: #b98a2c;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --ink: #13243a;
      --muted: #637083;
      --line: #dfe7ef;
      --green: #15803d;
      --red: #b42318;
      --amber: #b7791f;
      --shadow: 0 16px 36px rgba(7, 23, 44, 0.12);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(135deg, #07172c 0%, #102f4a 34%, #eef4f8 34%, #f8fbfd 100%);
      background-size: 40px 40px, 40px 40px, auto;
      min-height: 100vh;
    }

    button, input, select, textarea { font: inherit; }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--navy);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    button.secondary { background: #e8eef5; color: var(--ink); }
    button.ghost { background: transparent; color: #dceaff; border: 1px solid rgba(255,255,255,0.2); }
    button.gold { background: var(--gold); }
    button.danger { background: var(--red); }
    button.small { padding: 7px 10px; font-size: 13px; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 12px;
      background: #fff;
      color: var(--ink);
    }

    textarea { min-height: 96px; resize: vertical; }

    label {
      display: block;
      margin: 0 0 6px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 28px;
      background: rgba(7, 23, 44, 0.9);
      border-bottom: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
    }

    .brand {
      color: #fff;
      font-weight: 900;
      letter-spacing: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--cyan), var(--gold));
      color: var(--navy);
      font-weight: 900;
    }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    nav button {
      background: transparent;
      border: 1px solid transparent;
      color: #dceaff;
      padding: 8px 10px;
      font-weight: 700;
    }

    nav button.active,
    nav button:hover {
      border-color: rgba(27, 183, 216, 0.45);
      background: rgba(255,255,255,0.08);
      color: #fff;
    }

    main {
      max-width: 1220px;
      margin: 0 auto;
      padding: 28px;
    }

    .hero {
      min-height: calc(100vh - 110px);
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 28px;
      align-items: center;
      color: #fff;
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: clamp(44px, 8vw, 92px);
      line-height: 0.96;
      letter-spacing: 0;
    }

    .hero h2 {
      margin: 0 0 14px;
      font-size: clamp(22px, 4vw, 34px);
      line-height: 1.16;
      letter-spacing: 0;
      color: #e7f5ff;
    }

    .hero p {
      max-width: 820px;
      color: #d5e4f0;
      line-height: 1.72;
      font-size: 17px;
    }

    .hero-panel {
      background: rgba(255,255,255,0.94);
      color: var(--ink);
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .hero-panel h3 { margin: 0 0 12px; }
    .hero-panel ol { margin: 0; padding-left: 22px; line-height: 1.75; color: var(--muted); }

    .section {
      background: rgba(255,255,255,0.94);
      border: 1px solid rgba(223,231,239,0.9);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 24px;
      margin: 22px 0;
    }

    .section h2, .section h3 { margin: 0 0 12px; }
    .muted { color: var(--muted); line-height: 1.65; }
    .bilingual {
      display: block;
      line-height: 1.35;
    }
    .bilingual .cn, .bilingual .en {
      display: block;
    }
    .bilingual .en {
      color: var(--muted);
      font-size: 0.9em;
      font-weight: 650;
    }
    button .bilingual .en,
    .badge .bilingual .en {
      color: inherit;
      font-size: 0.82em;
      opacity: 0.82;
    }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
    }

    .formal-alignment-panel {
      margin-top: 18px;
      padding: 18px 0 0;
      border-top: 1px solid var(--line);
    }

    .formal-alignment-items {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .formal-alignment-item {
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .formal-alignment-item:last-child { border-bottom: 0; }

    .card h3, .card h4 { margin: 0 0 8px; }
    .stack { display: grid; gap: 14px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 800;
      background: #e8eef5;
      color: var(--navy);
    }

    .badge.good { background: #dcfce7; color: var(--green); }
    .badge.warn { background: #fff7d6; color: var(--amber); }
    .badge.bad { background: #fee4e2; color: var(--red); }
    .badge.blue { background: #e6f7fb; color: var(--blue); }
    .badge.neutral { background: #eef2f7; color: #526274; }

    .snippet {
      max-height: 120px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .split-panel {
      display: grid;
      grid-template-columns: minmax(280px, 0.9fr) minmax(0, 1.1fr);
      gap: 16px;
      align-items: start;
    }

    .student-pdf-preview {
      position: relative;
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #e9eef4;
      overflow: hidden;
    }

    .student-pdf-scroll {
      min-height: 420px;
      max-height: 760px;
      overflow: auto;
      padding: 16px;
    }

    .student-pdf-page {
      position: relative;
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 8px 24px rgba(7, 23, 44, 0.18);
      --scale-factor: 1;
      --user-unit: 1;
      --total-scale-factor: calc(var(--scale-factor) * var(--user-unit));
      --scale-round-x: 1px;
      --scale-round-y: 1px;
    }

    .student-pdf-page canvas {
      display: block;
      position: absolute;
      inset: 0;
    }

    /* Minimal text-layer rules derived from Apache-2.0 PDF.js 6.2.108. */
    .student-pdf-text-layer {
      color-scheme: only light;
      position: absolute;
      inset: 0;
      overflow: clip;
      opacity: 1;
      line-height: 1;
      letter-spacing: normal;
      word-spacing: normal;
      text-size-adjust: none;
      forced-color-adjust: none;
      transform-origin: 0 0;
      z-index: 2;
      --min-font-size: 1;
      --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size));
      --min-font-size-inv: calc(1 / var(--min-font-size));
    }

    .student-pdf-text-layer span,
    .student-pdf-text-layer br {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
      user-select: text;
    }

    .student-pdf-text-layer > :not(.markedContent),
    .student-pdf-text-layer .markedContent span:not(.markedContent) {
      z-index: 1;
      --font-height: 0;
      font-size: calc(var(--text-scale-factor) * var(--font-height));
      --scale-x: 1;
      --rotate: 0deg;
      transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv));
    }

    .student-pdf-text-layer .markedContent { display: contents; }
    .student-pdf-text-layer ::selection {
      background: rgba(27, 183, 216, 0.38);
      color: transparent;
    }

    .student-pdf-text-layer .endOfContent {
      display: block;
      position: absolute;
      inset: 100% 0 0;
      user-select: none;
    }

    .student-pdf-status {
      position: absolute;
      z-index: 4;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(7, 23, 44, 0.9);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .student-reader-fallback {
      max-height: 680px;
      overflow: auto;
      display: grid;
      gap: 12px;
      padding: 14px;
    }

    .review-queue-list {
      max-height: 760px;
      overflow: auto;
      display: grid;
      gap: 10px;
    }

    .review-item {
      text-align: left;
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      display: grid;
      gap: 7px;
      width: 100%;
    }

    .review-item.active {
      border-color: #8edbea;
      box-shadow: 0 0 0 3px rgba(14, 165, 193, 0.12);
    }

    .review-action {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      background: #fbfdff;
    }

    .review-action summary { cursor: pointer; font-weight: 800; }

    .progress {
      height: 8px;
      background: #e8eef5;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--gold));
    }

    .quote {
      border-left: 4px solid var(--cyan);
      background: #f7fbfd;
      padding: 12px;
      border-radius: 8px;
      color: #27384d;
      line-height: 1.6;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .form-grid .full { grid-column: 1 / -1; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    th, td {
      padding: 11px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th { color: var(--muted); background: #f6f9fc; }
    tr:last-child td { border-bottom: 0; }

    .notice {
      border: 1px solid #c6e7f0;
      background: #effaff;
      color: #16465a;
      padding: 12px;
      border-radius: var(--radius);
      line-height: 1.6;
    }

    .error { border-color: #fecaca; background: #fff1f2; color: #991b1b; }
    .success { border-color: #bbf7d0; background: #f0fdf4; color: #166534; }

    .app-layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 92px;
      background: rgba(255,255,255,0.95);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .sidebar button {
      width: 100%;
      text-align: left;
      margin: 3px 0;
      background: transparent;
      color: var(--ink);
      border: 1px solid transparent;
    }

    .sidebar button.active {
      background: #e6f7fb;
      border-color: #bdebf5;
      color: var(--blue);
    }

    .user-chip {
      color: #fff;
      font-size: 13px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .statusbar {
      display: none;
      position: sticky;
      top: 70px;
      z-index: 4;
      padding: 9px 28px;
      background: rgba(12, 38, 66, 0.94);
      border-bottom: 1px solid rgba(255,255,255,0.12);
      color: #dceaff;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .statusbar.visible { display: flex; }
    .statusbar .badge { background: rgba(255,255,255,0.12); color: #eef8ff; }
    .statusbar .badge.warn { background: rgba(255, 247, 214, 0.14); color: #ffe2a0; }
    .statusbar .badge.bad { background: rgba(254, 228, 226, 0.14); color: #ffb4aa; }

    .workspace-header {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(240px, 0.7fr);
      gap: 14px;
      align-items: start;
      margin-bottom: 16px;
    }

    .metric {
      display: grid;
      gap: 3px;
    }

    .metric strong {
      font-size: 28px;
      line-height: 1;
    }

    .learning-card-shell {
      display: grid;
      gap: 14px;
      padding: 0;
      overflow: hidden;
      border: 1px solid #cfe2ea;
      box-shadow: 0 18px 45px rgba(12, 38, 66, 0.08);
    }

    .learning-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding: 22px 24px 0;
    }

    .learning-card-eyebrow {
      color: #527086;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .learning-card-status {
      display: grid;
      justify-items: end;
      gap: 5px;
      text-align: right;
    }

    .learning-card-status strong {
      color: var(--blue);
      font-size: 15px;
    }

    .learning-card-front {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      min-height: 280px;
      margin: 0 24px;
      border: 1px solid #bdebf5;
      border-radius: 18px;
      background: linear-gradient(135deg, #f8fdff 0%, #eef9fc 100%);
      overflow: hidden;
    }

    .learning-card-prompt,
    .learning-card-answer {
      display: grid;
      align-content: center;
      gap: 12px;
      padding: 30px;
    }

    .learning-card-prompt {
      border-right: 1px solid #cfeaf1;
      background: rgba(255, 255, 255, 0.58);
    }

    .learning-card-term {
      margin: 0;
      color: var(--ink);
      font-size: clamp(30px, 4vw, 50px);
      line-height: 1.05;
      letter-spacing: -0.03em;
      overflow-wrap: anywhere;
    }

    .learning-card-answer .learning-card-term {
      color: var(--blue);
    }

    .learning-card-context {
      margin: 0;
      color: #3c5367;
      line-height: 1.65;
    }

    .learning-card-hidden-answer {
      min-height: 180px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 14px;
      text-align: center;
      color: #4f6577;
    }

    .learning-card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 24px;
    }

    .learning-card-actions button.is-active {
      color: #fff;
      background: var(--blue);
      border-color: var(--blue);
    }

    .learning-card-panel {
      margin: 0 24px 22px;
      padding: 20px;
      border: 1px solid #d8e6ec;
      border-radius: 16px;
      background: #fff;
    }

    .learning-card-panel[hidden] {
      display: none;
    }

    .learning-card-section-title {
      margin-top: 0;
    }

    .learning-card-state {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      padding: 0 24px;
    }

    .notebook-learning-layout {
      display: grid;
      grid-template-columns: minmax(280px, 0.72fr) minmax(0, 1.28fr);
      gap: 16px;
      align-items: start;
    }

    .notebook-row {
      text-align: left;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0;
    }

    .hidden { display: none !important; }

    @media (max-width: 900px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .statusbar { position: static; padding: 10px 16px; }
      .hero { grid-template-columns: 1fr; min-height: auto; padding-top: 34px; }
      .grid, .grid.two, .grid.four, .form-grid, .app-layout, .workspace-header, .split-panel, .learning-card-front, .notebook-learning-layout { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      main { padding: 16px; }
      .learning-card-header { padding: 18px 18px 0; }
      .learning-card-front { margin: 0 18px; }
      .learning-card-prompt { border-right: 0; border-bottom: 1px solid #cfeaf1; }
      .learning-card-actions, .learning-card-state { padding: 0 18px; }
      .learning-card-panel { margin: 0 18px 18px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">LB</div>
      <div>
        <div>LexiBridge AI</div>
        <small>AI 双语课程知识对齐平台 / Bilingual Course Knowledge Alignment</small>
      </div>
    </div>
    <nav id="topNav"></nav>
    <div id="userChip" class="user-chip"></div>
  </header>
  <div id="statusBar" class="statusbar"></div>

  <main id="app"></main>

  <script>
    const API_BASE = (window.LEXIBRIDGE_CONFIG && window.LEXIBRIDGE_CONFIG.API_BASE) || "http://127.0.0.1:5000";

    const state = {
      token: localStorage.getItem("lexibridge_token") || "",
      user: null,
      page: "home",
      currentCourseId: localStorage.getItem("lexibridge_current_course_id") || "",
      qcFilter: "all",
      selectedRun: null,
      message: "",
      messageType: "notice",
      courseSearch: "",
      reviewFilters: {
        status: "",
        course: "",
        chapter: "",
        risk_label: "",
        q: "",
        page: 1,
        per_page: 20
      },
      studentCardFilters: {
        course: "",
        chapter: "",
        q: "",
        favorited: "",
        mastered: "",
        page: 1,
        per_page: 20
      },
      studentConceptQuery: {
        sourceUid: "",
        workspaceScope: "",
        pageNumber: 1,
        selectedText: "",
        chunkUid: "",
        selectionStart: 0,
        selectionEnd: 0,
        loading: false,
        result: null
      },
      learningCard: {
        resultUid: "",
        evidenceExpanded: false,
        noteExpanded: false,
        reviewMode: false,
        answerRevealed: true
      },
      personalNotebookFilters: {
        view: "SAVED",
        workspace_scope: "",
        alignment_status: "",
        q: "",
        page: 1,
        per_page: 20
      },
      selectedNotebookQueryUid: "",
      teacherFeedbackFilters: {
        course: "",
        status: "",
        feedback_type: "",
        q: "",
        page: 1,
        per_page: 20
      },
      teacherAnalyticsFilters: {
        course: "",
        chapter: "",
        limit: 20
      },
      selectedReviewCardUid: "",
      selectedStudentConceptCardUid: "",
      pendingVerification: null,
      pendingReset: null,
      systemStatus: null,
      formalAlignment: {
        mode: "idle",
        run: null,
        items: [],
        pagination: null,
        error: null,
        source_uid: "",
        submitting: false,
        polling: false,
        loading_items: false
      },
      cache: {
        courses: [],
        myCourses: [],
        cards: [],
        documents: [],
        plans: [],
        qc: [],
        users: [],
        sources: [],
        versions: [],
        usage: null,
        logs: [],
        billing: [],
        jobs: [],
        alignmentRuns: [],
        evaluationRuns: [],
        feedback: [],
        reviewQueue: [],
        reviewHistory: [],
        reviewCard: null,
        reviewCase: null,
        reviewDraft: null,
        reviewPagination: null,
        studentConceptCards: [],
        studentConceptCard: null,
        studentConceptPagination: null,
        studentCourses: [],
        studentVisibilityError: "",
        studentProgress: null,
        studentConceptMaterials: [],
        personalMaterials: [],
        studentConceptChunks: [],
        studentMaterialReader: null,
        studentMaterialPdfUrl: "",
        studentMaterialPdfSourceUid: "",
        studentMaterialFileError: "",
        studentMaterialPdfRenderError: "",
        personalNotebookItems: [],
        personalNotebookSummary: null,
        personalNotebookPagination: null,
        studentPilot: null,
        conceptCardFeedbackQueue: [],
        conceptCardFeedbackPagination: null,
        teacherLearningAnalytics: null,
        teacherAnalyticsCards: [],
        teacherAnalyticsPagination: null,
        backlog: [],
        pilotReport: "",
        aiGovernance: null,
        retrievalDiagnostics: null,
        usageRecords: []
      }
    };

    const publicPages = [
      ["home", bilingual("首页", "Home")],

    function friendlyError(payload, fallback) {
      const code = payload && payload.error_code;
      const mapped = code && ERROR_MESSAGES[code] ? ERROR_MESSAGES[code] : "";
      const message = payload && (payload.message || payload.error);
      return [mapped, message || fallback].filter(Boolean).join(" · ");
    }

    function formatApiError(error, fallback = "Operation failed") {
      const payload = error && error.payload ? error.payload : {};
      const requestId = payload.request_id ? ` · request_id=${payload.request_id}` : "";
      const details = payload.details || {};
      const auditCode = details.audit_error_code ? ` · ${details.audit_error_code}` : "";
      return `${(error && error.message) || fallback}${auditCode}${requestId}`;
    }

    async function api(path, options = {}) {
      const headers = options.headers || {};
      if (!(options.body instanceof FormData)) headers["Content-Type"] = "application/json";
      if (state.token) headers.Authorization = `Bearer ${state.token}`;
      const response = await fetch(`${API_BASE}${path}`, { ...options, headers });
      let payload = {};
      try { payload = await response.json(); } catch (error) { payload = { status: "error", message: response.statusText }; }
      if (response.status === 401) {
        formalWorkflow.clear();
        releaseStudentMaterialPdf();
        localStorage.removeItem("lexibridge_token");
        state.token = "";
        state.user = null;
        state.page = "login";
      }
      if (!response.ok) {
        const error = new Error(friendlyError(payload, `HTTP ${response.status}`));
        error.payload = payload;
        error.status = response.status;
        throw error;
      }
      return payload;
    }

      getToken: () => state.token,
      onChange: snapshot => {
        state.formalAlignment = snapshot;

      },
      onAuthFailure: () => {
        localStorage.removeItem("lexibridge_token");
        state.token = "";
        state.user = null;
        state.page = "login";
      }
    });

        if (payload.system_status && payload.system_status.job_summary) {

        }
        return state.user;
      } catch (error) {
        releaseStudentMaterialPdf();
        state.token = "";
        state.user = null;
        localStorage.removeItem("lexibridge_token");
        return null;
      }
    }

    const CARD_STATUS_LABELS = {
      auto_approved: ["AI 自动通过", "Auto Approved"],
      approved: ["教师已审核", "Teacher Approved"],
      pending_quality_control: ["待教师审核", "Needs Review"],
      needs_more_evidence: ["证据不足", "Needs Evidence"],
      conflict_detected: ["存在冲突", "Conflict"],
      needs_review: ["待审核", "Needs Review"],
      rejected: ["已驳回", "Rejected"],
      deprecated: ["已废弃", "Deprecated"],
      archived: ["已归档", "Archived"],
      draft: ["草稿", "Draft"]
    };

    const ALIGNMENT_STATUS_LABELS = {
      exact_match: ["概念一致", "Exact Match"],
      accepted_translation: ["译名可接受", "Accepted Translation"],
      partial_match: ["部分匹配", "Partial Match"],
      no_en_evidence: ["缺少英文证据", "Missing English Evidence"],
      no_zh_evidence: ["缺少中文证据", "Missing Chinese Evidence"],
      domain_mismatch: ["领域错配", "Domain Mismatch"],
      ocr_low_confidence: ["OCR 低置信", "OCR Low Confidence"],
      formula_evidence_missing: ["公式证据缺失", "Formula Evidence Missing"],
      unverified_translation: ["未验证译名", "Unverified Translation"],
      invalid_term_candidate: ["无效术语候选", "Invalid Term Candidate"],
      ambiguous_candidate: ["候选歧义", "Ambiguous Candidate"],
      multi_translation_conflict: ["多译名冲突", "Translation Conflict"]
    };

    const JOB_STATUS_LABELS = {
      draft: ["未发布", "Draft"],
      active: ["已发布", "Active"],
      queued: ["排队中", "Queued"],
      running: ["运行中", "Running"],
      completed: ["已完成", "Completed"],
      failed: ["失败", "Failed"],
      retrying: ["重试中", "Retrying"],
      canceled: ["已取消", "Canceled"]
    };

    function labelFor(map, key) {
      const label = map[key] || [key || "未知", key || "Unknown"];
      return bilingual(label[0], label[1]);
    }

    function badgeClassForStatus(status) {
      if (["auto_approved", "approved", "completed", "exact_match", "accepted_translation"].includes(status)) return "good";
      if (["rejected", "failed", "domain_mismatch", "invalid_term_candidate"].includes(status)) return "bad";
      return "warn";
    }

    function statusBadge(status, kind = "card") {
      const map = kind === "alignment" ? ALIGNMENT_STATUS_LABELS : kind === "job" ? JOB_STATUS_LABELS : CARD_STATUS_LABELS;
      return `<span class="badge ${badgeClassForStatus(status)}">${labelFor(map, status)}</span>`;
    }

    function renderCards(cards) {
	      if (!cards.length) return `<p class="muted">${bilingual("暂无术语卡片。", "No terminology cards loaded.")}</p>`;
      return cards.map(card => `
        <div class="card">
          <div class="between">
            <h3>${escapeHtml(card.english_term)} -> ${escapeHtml(card.final_chinese_term || card.ai_translation_candidate)}</h3>
            ${statusBadge(card.status)}
          </div>
          <p class="muted">${escapeHtml(card.concept_explanation || "No explanation yet.")}</p>
          <div class="progress"><span style="width:${Math.max(0, Math.min(100, card.confidence_score || 0))}%"></span></div>
          <p>
	            <span class="badge blue">${bilingual(`置信度 ${card.confidence_score || 0}`, `Confidence ${card.confidence_score || 0}`)}</span>
            <span class="badge">${escapeHtml(card.scope_type)}</span>
            ${statusBadge(card.alignment_status || "unverified_translation", "alignment")}
            <span class="badge">${escapeHtml(card.ai_provider || "provider")}:${escapeHtml(card.ai_model || "local")}</span>
          </p>
	          ${["pending_quality_control", "needs_more_evidence", "conflict_detected"].includes(card.status) ? `<div class="notice">${bilingual("该术语仍在审核或证据补充阶段，请谨慎使用。", "This term is still under review or evidence collection. Use it carefully.")}</div>` : ""}
	          ${["mock", "local_heuristic", "none"].includes(String(card.ai_provider || "").toLowerCase()) ? `<div class="notice error">${bilingual("该结果由本地规则或演示 AI 生成，尚未通过真实 AI 或教师审核。", "This result was generated by local rules or demo AI and has not been verified by live AI or teacher review.")}</div>` : ""}
	          <p class="muted">${bilingual(`证据分数：英文 ${(Number(card.english_evidence_score || 0)).toFixed(2)} / 中文 ${(Number(card.chinese_evidence_score || 0)).toFixed(2)} · Prompt ${escapeHtml(card.prompt_version || "alignment_v1")}`, `Evidence Score: EN ${(Number(card.english_evidence_score || 0)).toFixed(2)} / ZH ${(Number(card.chinese_evidence_score || 0)).toFixed(2)} · Prompt ${escapeHtml(card.prompt_version || "alignment_v1")}`)}</p>
	          ${Array.isArray(card.quality_flags) && card.quality_flags.length ? `<p>${card.quality_flags.map(flag => `<span class="badge bad">${bilingual(flag, flag)}</span>`).join(" ")}</p>` : ""}
	          ${Array.isArray(card.quality_flags) && card.quality_flags.includes("formula_evidence_missing") ? `<div class="notice">${bilingual("相关公式区域已检测，但当前缺少可用公式 OCR 证据。", "Related formula region was detected, but usable Formula OCR evidence is missing.")}</div>` : ""}
	          ${card.risk_note ? `<div class="notice error"><strong>${bilingual("风险提示", "Risk")}:</strong> ${escapeHtml(card.risk_note)}</div>` : ""}

	          <div class="grid two">
	            <div class="quote"><strong>${bilingual("英文证据", "English Evidence")}</strong><br>${escapeHtml(card.english_kb_evidence || "No English evidence.")}</div>
	            <div class="quote"><strong>${bilingual("中文证据", "Chinese Evidence")}</strong><br>${escapeHtml(card.chinese_kb_evidence || "No Chinese evidence.")}</div>
	          </div>
	          <p class="muted"><strong>${bilingual("对齐理由", "Alignment Reason")}:</strong> ${escapeHtml(card.alignment_reason || "")}</p>
	          <div class="row">
	            <button class="small secondary" onclick="Lexi.favorite(${card.id})">${bilingual("收藏", "Favorite")}</button>
	            <button class="small secondary" onclick="Lexi.mastered(${card.id})">${bilingual("已掌握", "Mastered")}</button>
	            <button class="small secondary" onclick="Lexi.feedback(${card.id})">${bilingual("反馈", "Feedback")}</button>
	          </div>
        </div>
      `).join("");
    }

	        </form>
	        <div class="notice">${bilingual("定义课程名称后上传教师课件。课程至少有一份课件后才会在学生端课程搜索中出现。专业知识库不应要求教师手工上传。", "After defining the course name, upload teacher courseware. The course appears in student course search only after at least one courseware document exists. Domain KBs should not be a teacher manual-upload obligation.")}</div>
	        <div class="notice">${bilingual("自动专业知识库抓取需要生产级受控来源 connector：例如开放许可百科、公开课程资料 API、学校/图书馆/出版社授权接口。未配置时，对齐结果必须标记为证据不足或待审核。", "Automatic domain KB acquisition requires production-grade governed source connectors, such as open-license encyclopedias, public course APIs, or authorized school/library/publisher connectors. If not configured, alignment results must remain needs-evidence or review-needed.")}</div>
	        <div class="notice">${bilingual("PDF、PPTX、DOCX、TXT 会做基础文本解析；图片或扫描型 PDF 会调用配置的 OCR Provider。OCR 不可用时不会生成伪造文本或术语卡片。", "PDF, PPTX, DOCX, and TXT use native text parsing; images or scanned PDFs call the configured OCR Provider. If OCR is unavailable, the system does not fabricate text or terminology cards.")}</div>
	        <div class="stack">${renderDocuments(state.cache.documents)}</div>
	        ${!isPersonal ? renderFormalAlignmentPanel() : ""}
	      `);
	    }

    function governedSourceForDocument(documentId) {
      return (state.cache.sources || []).find(
        source => Number(source.document_id) === Number(documentId) && Boolean(source.source_uid)
      ) || null;
    }

    function formalStatusLabel(status, mode) {
      const labels = {
        queued: bilingual("已排队", "Queued"),
        validating: bilingual("正在校验", "Validating"),
        processing: bilingual("处理中", "Processing"),
        ready_for_review: bilingual("可供审核", "Ready for review"),
        completed_with_warnings: bilingual("完成但有警告", "Completed with warnings"),
        blocked: bilingual("业务条件阻断", "Blocked"),
        failed: bilingual("处理失败", "Failed"),
        connection_error: bilingual("连接中断", "Connection interrupted"),
        pending_submit: bilingual("等待继续提交", "Waiting to continue submission"),
        source_changed: bilingual("资料状态已变化", "Source changed"),
        request_blocked: bilingual("请求被业务规则阻止", "Request blocked")
      };
      return labels[status] || labels[mode] || bilingual("尚未开始", "Not started");
    }

    function renderFormalAlignmentItem(item) {
      const risks = Array.isArray(item.risk_labels) ? item.risk_labels : [];
      const confidence = item.confidence_summary
        ? escapeHtml(item.confidence_summary)
        : item.confidence_score === null || item.confidence_score === undefined
          ? bilingual("未提供", "Not provided")
          : escapeHtml(item.confidence_score);
      return `
        <article class="formal-alignment-item">
          <div class="between">
            <strong>${escapeHtml(item.candidate_term || item.normalized_term || "-")}</strong>
            ${statusBadge(item.status || "unknown", "job")}
          </div>
          ${item.normalized_term ? `<p class="muted">${bilingual("规范术语", "Normalized term")}: ${escapeHtml(item.normalized_term)}</p>` : ""}
          <p class="muted">${bilingual("阶段", "Stage")}: ${escapeHtml(item.stage || "-")} · ${bilingual("来源片段", "Source chunks")}: ${Number(item.source_chunk_count || 0)} · ${bilingual("置信度", "Confidence")}: ${confidence}</p>
          ${risks.length ? `<p>${risks.map(risk => `<span class="badge warn">${escapeHtml(risk)}</span>`).join(" ")}</p>` : ""}
          ${item.recommendation ? `<p>${escapeHtml(item.recommendation)}</p>` : ""}
          ${item.safe_error_message ? `<div class="notice">${escapeHtml(item.safe_error_message)}</div>` : ""}
        </article>
      `;
    }

    function renderFormalAlignmentPanel() {
      const active = state.formalAlignment || {};
      const run = active.run || {};
      const items = Array.isArray(active.items) ? active.items : [];
      const pagination = active.pagination || {};
      const status = run.status || active.last_status || active.mode;
      const hasActiveRun = Boolean(active.source_uid || active.run_uid || active.mode !== "idle");
      const progress = Number(run.progress_percent || 0);
      const error = active.error || {};
      const canResume = ["connection_error", "pending_submit"].includes(active.mode);
      return `
        <section class="formal-alignment-panel" aria-live="polite">
          <div class="between">
            <div>
              <h3>${bilingual("正式术语对齐", "Formal Terminology Alignment")}</h3>
              <div data-testid="formal-alignment-status">${formalStatusLabel(status, active.mode)}</div>
            </div>
            ${canResume ? `<button type="button" class="secondary small" data-testid="formal-alignment-resume" onclick="Lexi.resumeFormalAlignment()">${bilingual("继续查询", "Continue")}</button>` : `<button type="button" class="secondary small" data-testid="formal-alignment-resume" disabled>${bilingual("继续查询", "Continue")}</button>`}
          </div>
          <div data-testid="formal-alignment-progress" class="muted">${hasActiveRun ? `${bilingual("业务进度", "Business progress")}: ${Math.max(0, Math.min(100, progress))}% · ${bilingual("总项数", "Total items")}: ${Number(run.total_items || 0)} · ${bilingual("待审核", "Ready")}: ${Number(run.ready_for_review_items || 0)} · ${bilingual("阻断", "Blocked")}: ${Number(run.blocked_items || 0)} · ${bilingual("失败", "Failed")}: ${Number(run.failed_items || 0)} · ${bilingual("警告", "Warnings")}: ${Number(run.warning_count || 0)}` : bilingual("选择已完成治理入库的课程资料开始。", "Choose governed course material to begin.")}</div>
          <div data-testid="formal-alignment-error">${error.message ? `<div class="notice error">${active.mode === "source_changed" ? bilingual("资料状态已变化，请重新开始处理。", "The source changed; start again explicitly.") : escapeHtml(error.message)}${error.request_id ? ` · request_id=${escapeHtml(error.request_id)}` : ""}</div>` : ""}</div>
          <div data-testid="formal-alignment-items" class="formal-alignment-items">${items.map(renderFormalAlignmentItem).join("")}</div>
          <div class="between">
            <button type="button" class="secondary small" data-testid="formal-alignment-prev" onclick="Lexi.loadFormalAlignmentItems(${Math.max(1, Number(pagination.page || 1) - 1)})" ${!pagination.has_previous || active.loading_items ? "disabled" : ""}>${bilingual("上一页", "Previous")}</button>
            <span class="muted">${bilingual("第", "Page")} ${Number(pagination.page || 1)} / ${Number(pagination.total_pages || 0)} · ${bilingual("共", "Total")} ${Number(pagination.total_items || 0)}</span>
            <button type="button" class="secondary small" data-testid="formal-alignment-next" onclick="Lexi.loadFormalAlignmentItems(${Number(pagination.page || 1) + 1})" ${!pagination.has_next || active.loading_items ? "disabled" : ""}>${bilingual("下一页", "Next")}</button>
          </div>
        </section>
      `;
    }

    function renderDocuments(documents) {
	      if (!documents.length) return `<p class="muted">${bilingual("暂无文档。", "No documents loaded.")}</p>`;
	      return documents.map(doc => {
	        const job = state.cache.jobs.find(item => Number(item.document_id) === Number(doc.id));
	        return `
	        <div class="card">
	          <div class="between"><strong>${escapeHtml(doc.filename)}</strong><span class="badge ${doc.parsing_status === "parsed" ? "good" : "warn"}">${escapeHtml(doc.parsing_status)}</span></div>
	          <p class="muted">${bilingual(`范围：${escapeHtml(doc.scope_type)} | 语言：${escapeHtml(doc.language)} | 需要 OCR：${doc.ocr_required ? "是" : "否"} | OCR Provider：${escapeHtml(doc.ocr_provider || "not_required")} | OCR 状态：${escapeHtml(doc.ocr_status || "not_required")}`, `Scope: ${escapeHtml(doc.scope_type)} | Language: ${escapeHtml(doc.language)} | OCR required: ${doc.ocr_required ? "yes" : "no"} | OCR provider: ${escapeHtml(doc.ocr_provider || "not_required")} | OCR status: ${escapeHtml(doc.ocr_status || "not_required")}`)}</p>
	          <p class="muted">${bilingual(`公式块：${Number(doc.formula_blocks_count || 0)} | 公式 OCR：${escapeHtml(doc.formula_status || "not_required")} | Provider：${escapeHtml(doc.formula_provider || "not_required")}`, `Formula blocks: ${Number(doc.formula_blocks_count || 0)} | Formula OCR: ${escapeHtml(doc.formula_status || "not_required")} | Provider: ${escapeHtml(doc.formula_provider || "not_required")}`)}</p>
	          ${job ? `<p>${statusBadge(job.status, "job")} <span class="badge">Job #${job.id}</span> <span class="badge">${bilingual(`进度 ${job.progress_percent || 0}%`, `Progress ${job.progress_percent || 0}%`)}</span></p>` : ""}
	          ${doc.ocr_error ? `<div class="notice error">${escapeHtml(doc.ocr_error)}</div>` : ""}
	          ${(doc.formula_status && !["ok", "not_required"].includes(doc.formula_status)) ? `<div class="notice">${bilingual("检测到公式区域，但当前公式 OCR 未完全可用。", "Formula regions were detected, but Formula OCR is not fully available.")}</div>` : ""}
	          ${["teacher", "admin"].includes(state.user.role) && doc.scope_type === "course" ? `<div class="row"><button type="button" class="small secondary" data-testid="formal-alignment-start" data-document-id="${Number(doc.id)}" onclick="Lexi.startFormalAlignmentForDocument(${Number(doc.id)})" ${state.formalAlignment.submitting || state.formalAlignment.polling ? "disabled" : ""}>${bilingual("开始正式术语对齐", "Start Formal Alignment")}</button></div>` : ""}
	        </div>
      `}).join("");
    }

          <div class="notice">只记录完成状态、耗时区间、证据是否完整、是否保存/写过笔记和量表评分；不收集术语、证据正文或笔记正文。可随时退出并删除试用研究记录。</div>

            ${pilotSession && pilotSession.status === "COMPLETED" && !pilot.survey ? `

                <div><label>理解不确定性（1-5）</label><input name="uncertainty_understanding" type="number" min="1" max="5" required /></div>
                <div><label>任务难度（1-5）</label><input name="task_difficulty" type="number" min="1" max="5" required /></div>
                <label class="full"><input name="would_use_again" type="checkbox" /> 我愿意再次使用</label>

      const rows = materials.map(material => `
        <article class="card" data-testid="personal-material-item" data-material-id="${Number(material.material_id)}">

          <p class="muted">${escapeHtml(material.evidence_tier || "PERSONAL_PRIVATE")} · ${material.search_eligible ? "可检索" : "暂不可检索"} · qualification quality: ${escapeHtml(material.qualification_quality_status || "unknown")}</p>

      const chineseEvidence = materials.filter(material => material.material_role === "CHINESE_REFERENCE_EVIDENCE");
      const eligibleChineseEvidence = chineseEvidence.filter(material => material.processing_status === "READY" && material.search_eligible);
      return pageShell("我的学习空间", "你上传的资料仅供本人使用，不进入课程知识库或 Reviewer 队列。", `

            <input type="hidden" name="personal_workspace_contract" value="13C2" />
            <div><label>资料用途</label><select name="personal_material_role" required><option value="ENGLISH_COURSE_MATERIAL">英文课程资料</option><option value="CHINESE_REFERENCE_EVIDENCE">中文参考证据</option></select></div>

          <div class="notice">仅支持 PDF。系统保留页码、区块和文本跨度来源；不会翻译整篇资料，也不会把资料分享给教师或 Reviewer。</div>
          <div class="stack" data-testid="personal-material-list">${rows}</div>

    function studentAlignmentDisplay(status) {
      const values = {
        READY: {label: "证据充分", description: "双侧证据支持当前概念对应。", tone: "good"},
        REVIEW_REQUIRED: {label: "存在多个有证据的候选", description: "当前证据还不足以唯一确认，请比较候选与来源。", tone: "warn"},
        NOT_READY: {label: "暂无可靠中文对应", description: "独立中文资料中还没有足够可靠的概念证据。", tone: "warn"}
      };
      return values[status] || values.NOT_READY;
    }

    function learningCardStateFor(result) {
      const resultUid = String((result && result.result_uid) || "");
      if (state.learningCard.resultUid !== resultUid) {
        state.learningCard = {
          resultUid,
          evidenceExpanded: false,
          noteExpanded: false,
          reviewMode: false,
          answerRevealed: true
        };
      }
      return state.learningCard;
    }

    function resetStudentConceptResult() {
      state.studentConceptQuery.result = null;
      state.learningCard = {
        resultUid: "",
        evidenceExpanded: false,
        noteExpanded: false,
        reviewMode: false,
        answerRevealed: true
      };
    }

    function renderStudentConceptResult(result) {
      if (!result) return `<div class="card" data-testid="student-concept-result-empty"><p class="muted">请先在英文资料中选择一个专业概念。</p></div>`;
      const recommended = result.recommended_chinese_concept;
      const evidence = items => (items || []).map(item => `<div class="quote"><p>${escapeHtml(item.snippet || "")}</p><small>${escapeHtml(item.source_uid || "")} · page ${escapeHtml(item.page_number || "-")}</small></div>`).join("") || `<p class="muted">暂无可用证据。</p>`;
      const display = studentAlignmentDisplay(result.alignment_status);
      const statusText = result.student_explanation || display.description;
      const support = result.learning_support || {};
      const sourceUnavailable = support.status === "SOURCE_UNAVAILABLE" || result.source_availability === "SOURCE_UNAVAILABLE";
      const groundingNotice = sourceUnavailable
        ? "原资料已不可用；仅保留历史对齐结论和个人记录，不再展示或解释旧证据。"
        : "以下学习说明只根据当前双侧证据整理；不会补写证据中不存在的概念差异。";
      const meaning = support.what_it_means_here || {};
      const rationale = support.why_they_align || {};
      const alternatives = support.alternatives || [];
      const candidateList = alternatives.map(alternative => `<div class="quote" data-testid="student-alternative-evidence"><p><strong>${escapeHtml(alternative.term || "")}</strong></p><p>${escapeHtml((alternative.evidence && alternative.evidence.snippet) || "")}</p><small>${escapeHtml((alternative.evidence && alternative.evidence.source_uid) || "")} · page ${escapeHtml((alternative.evidence && alternative.evidence.page_number) || "-")}</small><p class="muted">${escapeHtml(alternative.student_message || "")}</p></div>`).join("");
      const conceptComparisonList = comparisons => (comparisons || []).map(comparison => `<div class="card" data-testid="student-concept-comparison"><h4>${escapeHtml(comparison.recommended_term || "")} / ${escapeHtml(comparison.alternative_term || "")}</h4><div class="grid two"><div class="quote"><p>${escapeHtml((comparison.recommended_evidence && comparison.recommended_evidence.snippet) || "")}</p></div><div class="quote"><p>${escapeHtml((comparison.alternative_evidence && comparison.alternative_evidence.snippet) || "")}</p></div></div><p class="muted">${escapeHtml(comparison.student_message || "")}</p></div>`).join("") || `<p class="muted">当前没有可安全并列比较的 evidence-backed 候选。</p>`;
      const hints = (result.generated_hints || []).map(hint => `<div class="notice" data-testid="student-generated-hint-warning"><strong>机器提示（非证据）</strong><p>${escapeHtml(hint.text || "")}</p><small>generated=true · evidence_backed=false</small></div>`).join("");
      const riskSummary = (result.student_risk_summary || []).map(item => `<li>${escapeHtml(item)}</li>`).join("");
      const saved = Boolean(result.personal_state && result.personal_state.saved);
      const understanding = String((result.personal_state && result.personal_state.understanding_state) || "UNMARKED");
      const learningCard = learningCardStateFor(result);
      const showAnswer = !learningCard.reviewMode || learningCard.answerRevealed;
      const workspaceLabel = result.workspace_scope === "PERSONAL" ? "我的资料" : escapeHtml(result.course_name || "机构托管课程资料");
      const answerHeading = sourceUnavailable ? "历史对齐中文概念" : result.alignment_status === "REVIEW_REQUIRED" ? "可能对应" : "推荐中文概念";
      const chineseTerm = (recommended && recommended.text) || "暂无可靠中文对应";
      return `<section class="card learning-card-shell" data-testid="student-concept-result">
        <header class="learning-card-header">
          <div>
            <div class="learning-card-eyebrow">个人学习结果 · 非课程官方答案 · PRIVATE · NON_OFFICIAL</div>
            <h2>概念学习卡</h2>
            <p class="muted">${workspaceLabel} · ${sourceUnavailable ? "历史记录" : "证据驱动"}</p>
          </div>
          <div class="learning-card-status">
            <span class="badge ${display.tone}" data-testid="student-alignment-status" data-machine-status="${escapeHtml(result.alignment_status)}">机器对齐状态</span>
            <strong data-testid="student-learning-card-status-label">${escapeHtml(display.label)}</strong>
          </div>
        </header>
        <div class="learning-card-state">
          <span class="badge ${saved ? "good" : "neutral"}">${saved ? "已保存" : "未保存"}</span>
          <span class="badge ${understanding === "UNDERSTOOD" ? "good" : understanding === "STILL_CONFUSED" ? "warn" : "neutral"}">${understanding === "UNDERSTOOD" ? "已理解" : understanding === "STILL_CONFUSED" ? "仍然困惑" : "未标记理解状态"}</span>
          ${learningCard.reviewMode ? `<span class="badge blue">复习模式</span>` : ""}
        </div>
        <div class="notice" data-testid="student-learning-support-grounding">${groundingNotice}</div>
        <article class="learning-card-front" data-testid="student-learning-card">
          <div class="learning-card-prompt" data-testid="student-learning-card-front">
            <span class="learning-card-eyebrow">English concept</span>
            <h3 class="learning-card-term" data-testid="student-result-english-term">${escapeHtml(result.english_term || result.selected_text || "")}</h3>
            ${learningCard.reviewMode ? `<p class="muted">先回忆中文概念，再显示答案。</p>` : `<p class="muted">来自当前英文课程语境</p>`}
          </div>
          <div class="learning-card-answer" data-testid="student-learning-card-answer">
            ${showAnswer ? `
              <span class="learning-card-eyebrow">${answerHeading}</span>
              <h3 class="learning-card-term" data-testid="student-result-chinese-term">${escapeHtml(chineseTerm)}</h3>

          <button class="secondary ${learningCard.reviewMode ? "is-active" : ""}" data-testid="student-learning-card-review-toggle" onclick="Lexi.startLearningCardReview()" ${saved ? "" : "disabled"}>${learningCard.reviewMode ? "退出复习" : "开始复习"}</button>
          <button class="secondary ${learningCard.evidenceExpanded ? "is-active" : ""}" data-testid="student-learning-card-evidence-toggle" onclick="Lexi.toggleLearningCardSection('evidence')" ${learningCard.reviewMode && !learningCard.answerRevealed ? "disabled" : ""}>${learningCard.evidenceExpanded ? "收起证据" : "展开证据"}</button>
          <button class="secondary ${learningCard.noteExpanded ? "is-active" : ""}" data-testid="student-learning-card-note-toggle" onclick="Lexi.toggleLearningCardSection('note')">${learningCard.noteExpanded ? "收起笔记" : "个人笔记"}</button>

          <button class="secondary ${understanding === "STILL_CONFUSED" ? "is-active" : ""}" data-testid="student-query-confused" onclick="Lexi.updatePersonalConceptState({understanding_state:'STILL_CONFUSED'})">仍然困惑</button>
          ${(state.cache.studentPilot && state.cache.studentPilot.enabled && state.cache.studentPilot.latest_session && state.cache.studentPilot.latest_session.status === "STARTED" && result.workspace_scope === "PERSONAL") ? `<button class="secondary" data-testid="student-pilot-complete" onclick="Lexi.completeStudentPilotSession()">完成试用任务</button>` : ""}

        <section class="learning-card-panel" data-testid="student-learning-card-evidence" ${learningCard.evidenceExpanded ? "" : "hidden"}>
          <h3 class="learning-card-section-title">证据与候选</h3>
          <div class="grid two"><div><h4>English Evidence</h4><div data-testid="student-query-english-evidence">${evidence(result.english_evidence)}</div></div><div><h4>中文证据</h4><div data-testid="student-query-chinese-evidence">${evidence(result.chinese_evidence)}</div></div></div>
          <div class="grid two">
            <div><h4>Why They Align</h4><p data-testid="student-alignment-rationale">${escapeHtml(rationale.summary || statusText)}</p></div>
            <div><h4>Alternatives</h4>${candidateList || `<p class="muted">当前没有其他有证据支持的候选。</p>`}</div>
            <div><h4>Do Not Confuse With</h4>${conceptComparisonList(support.do_not_confuse_with)}</div>
            <div><h4>Confidence / Uncertainty</h4><p>${escapeHtml(statusText)}</p>${riskSummary ? `<ul>${riskSummary}</ul>` : ""}</div>

        </section>
        <section class="learning-card-panel" data-testid="student-learning-card-note-panel" ${learningCard.noteExpanded ? "" : "hidden"}>
          <h3 class="learning-card-section-title">我的理解</h3>
          <form class="form-grid" onsubmit="Lexi.savePersonalConceptNote(event)"><div class="full"><label>个人笔记</label><textarea name="note" data-testid="student-query-note" placeholder="用自己的话写下概念含义、易混点或仍然不懂的问题。">${escapeHtml((result.personal_state && result.personal_state.note) || "")}</textarea></div><button data-testid="student-query-note-save">保存笔记</button></form>

    function renderStudentMaterialReader() {
      const active = state.studentConceptQuery;
      const reader = state.cache.studentMaterialReader;
      if (!reader) return `<div class="card" data-testid="student-material-reader"><p class="muted">请选择一份已有治理和解析的英文资料。</p></div>`;
      const source = reader.source || {};
      const page = reader.page || {};
      const items = reader.items || [];
      const pdfUrl = state.cache.studentMaterialPdfUrl;
      const pdfRenderError = state.cache.studentMaterialPdfRenderError;
      const usePdfTextLayer = Boolean(pdfUrl && !pdfRenderError);
      const sourceLabel = source.workspace_scope === "PERSONAL"
        ? "我的资料 · 个人学习结果"
        : source.workspace_scope === "MANAGED_COURSE"
          ? `${escapeHtml(source.course_name || "机构托管课程")} · 课程资料`
          : "英文学习资料";
      return `<section class="card" data-testid="student-material-reader">
        <div class="between">
          <div><h2>${escapeHtml(source.title || "英文学习资料")}</h2><p class="muted">${sourceLabel} · 非课程官方答案</p></div>
          <div class="row" data-testid="student-reader-page">
            <button class="small secondary" data-testid="student-reader-prev" onclick="Lexi.changeStudentReaderPage(${Number(page.previous_page || 0)})" ${page.previous_page ? "" : "disabled"}>上一页</button>
            <span class="badge neutral">第 ${Number(page.number || 1)} / ${Number(page.page_count || 1)} 页</span>
            <button class="small secondary" data-testid="student-reader-next" onclick="Lexi.changeStudentReaderPage(${Number(page.next_page || 0)})" ${page.next_page ? "" : "disabled"}>下一页</button>
          </div>
        </div>
        <div class="notice">在 PDF 页面文字上直接选择一个英文术语或短语。系统只在选择能够唯一映射到受治理的 source / page / block / chunk / span 时允许查询。</div>
        <div class="student-pdf-preview" data-testid="student-pdf-preview">
          ${usePdfTextLayer ? `<div class="student-pdf-scroll">
            <div class="student-pdf-page" data-testid="student-pdf-page">
              <canvas data-testid="student-pdf-canvas" aria-label="${escapeHtml(source.title || "Course PDF")} · page ${Number(page.number || 1)}"></canvas>
              <div class="student-pdf-text-layer textLayer" data-testid="student-pdf-text-layer" aria-label="可选择的 PDF 文字层"></div>
            </div>
            <div class="student-pdf-status" data-testid="student-pdf-status">正在加载 PDF 页面…</div>
          </div>` : `<div class="student-reader-fallback" data-testid="student-pdf-fallback">
            <div class="notice error">${escapeHtml(pdfRenderError || state.cache.studentMaterialFileError || "当前资料没有可用的 PDF 文本层；可以从受治理的同页文本继续选择。")}</div>
            ${items.map(chunk => `<article class="quote"><div class="muted">${escapeHtml(chunk.heading_path || "")} · page ${Number(chunk.page_number)} · ${escapeHtml(chunk.block_type || "text")}</div><div data-testid="student-material-chunk" data-chunk-uid="${escapeHtml(chunk.chunk_uid)}" onmouseup="Lexi.captureGovernedFallbackSelection(event)">${escapeHtml(chunk.text)}</div></article>`).join("") || `<p class="muted">本页没有可选择且 provenance 完整的英文证据块。</p>`}
          </div>`}
        </div>
        <div class="notice" data-testid="student-selection-summary">${active.selectedText ? `已选择：${escapeHtml(active.selectedText)}` : "尚未选择概念"}</div>
        <div data-testid="student-reader-selection-action"><button data-testid="student-concept-align-action" onclick="Lexi.submitStudentConceptQuery()" ${!active.selectedText || active.loading ? "disabled" : ""}>${active.loading ? "正在检索证据…" : "查看概念对应"}</button></div>
      </section>`;
    }

    function renderStudentConceptQuery() {
      const active = state.studentConceptQuery;
      const materials = state.cache.studentConceptMaterials || [];
      return pageShell("资料阅读与概念查询", "阅读有权访问的英文 PDF，直接在页面文字上选择一个专业概念，获得有证据且明确表达不确定性的私人学习结果。", `
        <div class="card" data-testid="student-concept-query-page">
          <label>英文学习资料</label>
          <select data-testid="student-concept-material-select" onchange="Lexi.selectConceptMaterial(this.value)">
            <option value="">请选择资料</option>
            ${materials.map(item => `<option value="${escapeHtml(item.source_uid)}" ${active.sourceUid === item.source_uid ? "selected" : ""}>${escapeHtml(item.title)} · ${item.workspace_scope === "PERSONAL" ? "我的资料" : escapeHtml(item.course_name || "课程资料")}</option>`).join("")}
          </select>
        </div>

      const pagination = state.cache.personalNotebookPagination || {};
      const rows = items.map(item => {
        const recommended = item.recommended_chinese_concept;
        const display = studentAlignmentDisplay(item.alignment_status);

          <p>${escapeHtml((recommended && recommended.text) || "暂无可靠中文对应")}</p>

      return pageShell("个人概念本", "Personal 与 Managed Course 的普通查询共用同一个私人学习记录；不会进入 Reviewer 队列，也不会变成官方课程内容。", `
        <section data-testid="personal-concept-notebook-page">
          <div class="grid four" data-testid="notebook-summary">
            <div class="card metric"><strong>${Number(summary.saved_total || 0)}</strong><span class="muted">已保存</span></div>
            <div class="card metric"><strong>${Number(summary.understood_total || 0)}</strong><span class="muted">理解了</span></div>

          <form class="card form-grid" onsubmit="Lexi.applyNotebookFilters(event)">

            <div><label>学习视图</label><select data-testid="notebook-view-filter" name="view"><option value="SAVED" ${filters.view === "SAVED" ? "selected" : ""}>已保存</option><option value="HISTORY" ${filters.view === "HISTORY" ? "selected" : ""}>全部历史</option><option value="UNDERSTOOD" ${filters.view === "UNDERSTOOD" ? "selected" : ""}>理解了</option><option value="STILL_CONFUSED" ${filters.view === "STILL_CONFUSED" ? "selected" : ""}>仍然困惑</option></select></div>
            <div><label>学习空间</label><select data-testid="notebook-workspace-filter" name="workspace_scope"><option value="">全部</option><option value="PERSONAL" ${filters.workspace_scope === "PERSONAL" ? "selected" : ""}>PERSONAL</option><option value="MANAGED_COURSE" ${filters.workspace_scope === "MANAGED_COURSE" ? "selected" : ""}>MANAGED_COURSE</option></select></div>
            <div><label>机器状态</label><select data-testid="notebook-alignment-filter" name="alignment_status"><option value="">全部</option><option value="READY" ${filters.alignment_status === "READY" ? "selected" : ""}>READY</option><option value="REVIEW_REQUIRED" ${filters.alignment_status === "REVIEW_REQUIRED" ? "selected" : ""}>REVIEW_REQUIRED</option><option value="NOT_READY" ${filters.alignment_status === "NOT_READY" ? "selected" : ""}>NOT_READY</option></select></div>
            <button>筛选</button>
          </form>
          <div class="notebook-learning-layout">
            <div class="stack">${rows || `<div class="card" data-testid="notebook-empty"><p class="muted">当前筛选条件下还没有私人学习记录。</p></div>`}
              <div class="row"><button class="secondary small" onclick="Lexi.changeNotebookPage(${Number(pagination.page || 1) - 1})" ${Number(pagination.page || 1) <= 1 ? "disabled" : ""}>上一页</button><span class="badge neutral">${Number(pagination.total || 0)} 条</span><button class="secondary small" onclick="Lexi.changeNotebookPage(${Number(pagination.page || 1) + 1})" ${pagination.has_next ? "" : "disabled"}>下一页</button></div>
            </div>
            <div>${state.studentConceptQuery.result ? renderStudentConceptResult(state.studentConceptQuery.result) : `<div class="card"><p class="muted">选择一个记录以重访证据、笔记和理解状态。</p></div>`}</div>
          </div>
        </section>
      `);
    }

      return items.slice(0, 4).map(source => `
        <span class="badge neutral">${escapeHtml(source.source_title || source.source_uid || "Source")} · ${escapeHtml(source.source_role || "-")} · ${escapeHtml(source.trust_level || "-")}</span>
      `).join(" ");
    }

          </div>
        </div>

    function renderStudentConceptRow(card) {

    function arrayValue(value) {
      if (!value) return [];
      if (Array.isArray(value)) return value;
      if (typeof value === "string") {
        try {
          const parsed = JSON.parse(value);
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          return value.trim() ? [value] : [];
        }
      }
      return typeof value === "object" ? [value] : [];
    }

    function riskChips(labels, tone = "bad") {
      const items = arrayValue(labels);
      if (!items.length) return `<span class="badge neutral">${bilingual("无风险标签", "No risk labels")}</span>`;
      return items.map(label => `<span class="badge ${tone}">${escapeHtml(label)}</span>`).join(" ");
    }

    function evidenceScore(item) {
      const score = item.score ?? item.retrieval_score ?? item.evidence_score ?? item.lexical_score;
      return score === undefined || score === null || score === "" ? "-" : Number(score).toFixed(2);
    }

    function renderEvidenceProvenance(item) {
      const location = item.location_available === false
        ? bilingual("该来源没有页面定位信息", "No page location available")
        : bilingual(`页 ${item.page_number || "-"} · ${item.source_locator || "-"}`, `page ${item.page_number || "-"} · ${item.source_locator || "-"}`);
      const bbox = item.bbox_available
        ? `bbox ${JSON.stringify(item.bbox)}`
        : bilingual("bbox 不可用", "bbox unavailable");
      const parser = item.parser || item.parse_quality_status || item.quality_status || "-";
      const block = item.block_type || "-";
      const sourceStatus = item.source_available === false
        ? `<span class="badge bad">${bilingual("来源不可用", "Source unavailable")}: ${escapeHtml(item.source_unavailable_reason || item.source_status || "-")}</span>`
        : `<span class="badge good">${bilingual("来源有效", "Source active")}</span>`;
      return `
        <p class="muted" data-testid="evidence-provenance">
          ${escapeHtml(location)} · ${escapeHtml(bbox)} · block ${escapeHtml(block)} · parser ${escapeHtml(parser)}
          ${sourceStatus}
        </p>
      `;
    }

    function renderEvidenceItems(items, emptyText) {
      const evidence = arrayValue(items);
      if (!evidence.length) return `<div class="notice error">${emptyText}</div>`;
      return `<div class="stack">${evidence.slice(0, 8).map(item => {
        if (typeof item === "string") {
          return `<div class="quote snippet">${escapeHtml(item.slice(0, 600))}</div>`;
        }
        const snippet = String(item.snippet || item.text || item.content_excerpt || item.evidence_snippet || "").slice(0, 600);
        return `
          <div class="quote">
            <div class="between">
              <strong>${escapeHtml(item.source_title || item.source_uid || "Evidence")}</strong>
              <span class="badge blue">${bilingual(`分数 ${evidenceScore(item)}`, `Score ${evidenceScore(item)}`)}</span>
            </div>
            <p class="muted">${escapeHtml(item.source_role || item.source_type || "-")} · ${escapeHtml(item.trust_level || "-")} · ${escapeHtml(item.quality_status || "-")} · ${escapeHtml(item.source_locator || item.page_number || item.slide_number || "-")}</p>
            ${renderEvidenceProvenance(item)}
            <div class="snippet">${escapeHtml(snippet || "No snippet.")}</div>
            ${Array.isArray(item.risk_labels) && item.risk_labels.length ? `<p>${riskChips(item.risk_labels, "warn")}</p>` : ""}
          </div>
        `;
      }).join("")}</div>`;
    }

    let reviewCardLoadSequence = 0;

    async function loadReviewQueue() {
      if (!state.user || !["reviewer", "admin"].includes(state.user.role)) return;
      const query = reviewQueryString();
      const payload = await api(`/api/concept-cards/review-queue${query ? `?${query}` : ""}`);
      const data = payload.data || {};
      state.cache.reviewQueue = data.items || [];
      state.cache.reviewPagination = data.pagination || null;
      if (!state.selectedReviewCardUid && state.cache.reviewQueue.length) {
        state.selectedReviewCardUid = state.cache.reviewQueue[0].card_uid;
      }
      if (state.selectedReviewCardUid) {
        const stillVisible = state.cache.reviewQueue.some(card => card.card_uid === state.selectedReviewCardUid);
        if (!stillVisible && state.cache.reviewQueue.length) state.selectedReviewCardUid = state.cache.reviewQueue[0].card_uid;
        await loadReviewCard(state.selectedReviewCardUid);
      } else {
        reviewCardLoadSequence += 1;
        state.cache.reviewCard = null;
        state.cache.reviewHistory = [];
      }
    }

    async function loadReviewCard(cardUid) {
      if (!cardUid) return;
      const loadSequence = ++reviewCardLoadSequence;
      const [cardPayload, reviewsPayload, reviewCasePayload] = await Promise.all([
        api(`/api/concept-cards/${encodeURIComponent(cardUid)}`),
        api(`/api/concept-cards/${encodeURIComponent(cardUid)}/reviews?per_page=50`),
        api(`/api/concept-cards/${encodeURIComponent(cardUid)}/review-case`)
      ]);
      if (loadSequence !== reviewCardLoadSequence || state.selectedReviewCardUid !== cardUid) return;
      const card = (cardPayload.data && cardPayload.data.card) || cardPayload.card || {};
      const queueItem = (state.cache.reviewQueue || []).find(item => item.card_uid === cardUid) || {};
      const reviewCard = { ...queueItem, ...card };
      const reviewHistory = (reviewsPayload.data && reviewsPayload.data.items) || [];
      const reviewCase = (reviewCasePayload.data && reviewCasePayload.data.case) || null;
      let reviewDraft = null;
      if (reviewCase && reviewCase.draft && reviewCase.draft.draft_status === "DRAFT") {
        const draftPayload = await api(`/api/concept-cards/${encodeURIComponent(cardUid)}/draft`);
        if (loadSequence !== reviewCardLoadSequence || state.selectedReviewCardUid !== cardUid) return;
        reviewDraft = draftPayload.data && draftPayload.data.draft;
      }
      const verification = (queueItem && queueItem.verification_summary) || null;
      if (verification) reviewCard.verification_summary = verification;
      state.cache.reviewCard = reviewCard;
      state.cache.reviewHistory = reviewHistory;
      state.cache.reviewCase = reviewCase;
      state.cache.reviewDraft = reviewDraft;
    }

    let studentPdfRenderTicket = 0;

    function releaseStudentMaterialPdf() {
      studentPdfRenderTicket += 1;
      if (window.LexiPdfReader && typeof window.LexiPdfReader.destroy === "function") {
        window.LexiPdfReader.destroy().catch(() => {});
      }
      if (state.cache.studentMaterialPdfUrl) URL.revokeObjectURL(state.cache.studentMaterialPdfUrl);
      state.cache.studentMaterialPdfUrl = "";
      state.cache.studentMaterialPdfSourceUid = "";
      state.cache.studentMaterialFileError = "";
      state.cache.studentMaterialPdfRenderError = "";
    }

    async function loadStudentMaterialFile(sourceUid, reader) {
      releaseStudentMaterialPdf();
      if (!reader || !reader.source || !reader.source.file_available) return;
      const headers = {};
      if (state.token) headers.Authorization = `Bearer ${state.token}`;
      const filePath = `/api/student/concept-materials/${encodeURIComponent(sourceUid)}/file`;
      try {
        const response = await fetch(`${API_BASE}${filePath}`, { headers });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const contentType = String(response.headers.get("Content-Type") || "").toLowerCase();
        if (!contentType.includes("application/pdf")) throw new Error("PDF content type is invalid");
        const blob = await response.blob();
        state.cache.studentMaterialPdfUrl = URL.createObjectURL(blob);
        state.cache.studentMaterialPdfSourceUid = sourceUid;
        state.cache.studentMaterialPdfRenderError = "";
      } catch (error) {
        state.cache.studentMaterialFileError = "原始 PDF 暂不可预览；你仍可使用有 provenance 的解析文本。";
      }
    }

    function scheduleStudentPdfRender() {
      const reader = state.cache.studentMaterialReader;
      const sourceUrl = state.cache.studentMaterialPdfUrl;
      if (!reader || !sourceUrl || state.cache.studentMaterialPdfRenderError) return;
      const ticket = ++studentPdfRenderTicket;
      window.requestAnimationFrame(() => renderStudentPdfPage(ticket));
    }

    async function renderStudentPdfPage(ticket) {
      try {
        const pdfReader = window.LexiPdfReader
          || await import("./js/pdfjs-concept-reader.mjs");
        if (ticket !== studentPdfRenderTicket || state.page !== "conceptQuery") return;
        const preview = document.querySelector('[data-testid="student-pdf-preview"]');
        const pageElement = document.querySelector('[data-testid="student-pdf-page"]');
        const canvas = document.querySelector('[data-testid="student-pdf-canvas"]');
        const textLayer = document.querySelector('[data-testid="student-pdf-text-layer"]');
        const statusElement = document.querySelector('[data-testid="student-pdf-status"]');
        if (!preview || !pageElement || !canvas || !textLayer || !statusElement) return;
        const renderPage = pdfReader.renderPdfConceptPage
          || window.LexiPdfReader.renderPdfConceptPage;
        await renderPage({
          sourceUrl: state.cache.studentMaterialPdfUrl,
          pageNumber: state.studentConceptQuery.pageNumber,
          items: (state.cache.studentMaterialReader && state.cache.studentMaterialReader.items) || [],
          preview,
          canvas,
          textLayer,
          pageElement,
          statusElement,
        });
      } catch (error) {
        if (ticket !== studentPdfRenderTicket) return;
        state.cache.studentMaterialPdfRenderError = "PDF 页面文字层无法安全加载；已切换到受治理的同页文本。";
        render();
      }
    }

    async function loadStudentMaterialReader(sourceUid, pageNumber = 1, reloadFile = false) {
      const payload = await api(`/api/student/concept-materials/${encodeURIComponent(sourceUid)}/reader?page=${Number(pageNumber || 1)}`);
      const reader = payload.data && payload.data.reader;
      state.cache.studentMaterialReader = reader || null;
      state.cache.studentConceptChunks = (reader && reader.items) || [];
      const source = reader && reader.source;
      state.studentConceptQuery.sourceUid = sourceUid;
      state.studentConceptQuery.workspaceScope = (source && source.workspace_scope) || "";
      state.studentConceptQuery.pageNumber = Number(reader && reader.page && reader.page.number || 1);
      state.studentConceptQuery.selectedText = "";
      state.studentConceptQuery.chunkUid = "";
      state.studentConceptQuery.result = null;
      if (reloadFile || state.cache.studentMaterialPdfSourceUid !== sourceUid) {
        await loadStudentMaterialFile(sourceUid, reader);
      }
    }

    async function loadStudentConceptChunks(sourceUid) {

    async function loadStudentConceptCards() {
      if (!state.user) return;
      await loadStudentCourses();
      await loadStudentProgress();
      const query = studentConceptQueryString();
      const payload = await api(`/api/student/concept-cards${query ? `?${query}` : ""}`);
      const data = payload.data || {};
      state.cache.studentConceptCards = data.items || [];
      state.cache.studentConceptPagination = data.pagination || null;
      if (!state.selectedStudentConceptCardUid && state.cache.studentConceptCards.length) {
        state.selectedStudentConceptCardUid = state.cache.studentConceptCards[0].card_uid;
      }
      if (state.selectedStudentConceptCardUid) {
        const stillVisible = state.cache.studentConceptCards.some(card => card.card_uid === state.selectedStudentConceptCardUid);
        if (!stillVisible && state.cache.studentConceptCards.length) state.selectedStudentConceptCardUid = state.cache.studentConceptCards[0].card_uid;
        if (!stillVisible && !state.cache.studentConceptCards.length) state.selectedStudentConceptCardUid = "";
        if (state.selectedStudentConceptCardUid) await loadStudentConceptCard(state.selectedStudentConceptCardUid);
      } else {
        state.cache.studentConceptCard = null;
      }
    }

    async function loadStudentConceptCard(cardUid) {
      if (!cardUid) return;
      const payload = await api(`/api/student/concept-cards/${encodeURIComponent(cardUid)}`);
      state.cache.studentConceptCard = (payload.data && payload.data.card) || null;
      const index = (state.cache.studentConceptCards || []).findIndex(card => card.card_uid === cardUid);
      if (index >= 0 && state.cache.studentConceptCard) {
        state.cache.studentConceptCards[index] = { ...state.cache.studentConceptCards[index], ...state.cache.studentConceptCard };
      }
    }

      captureGovernedFallbackSelection(event) {
        const selection = window.getSelection();
        if (!selection || selection.rangeCount !== 1 || selection.isCollapsed) return;
        const range = selection.getRangeAt(0);
        const container = event.currentTarget;
        if (!container.contains(range.commonAncestorContainer)) return;
        const prefix = document.createRange();
        prefix.selectNodeContents(container);
        prefix.setEnd(range.startContainer, range.startOffset);
        const selectedText = selection.toString();
        resetStudentConceptResult();
        state.studentConceptQuery.selectedText = selectedText;
        state.studentConceptQuery.chunkUid = String(container.dataset.chunkUid || "");
        state.studentConceptQuery.selectionStart = prefix.toString().length;
        state.studentConceptQuery.selectionEnd = prefix.toString().length + selectedText.length;
        render();
      },
