name: Browser E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/app.py"
      - "backend/services/student_*.py"
      - "backend/services/concept_card_*.py"
      - "backend/services/course_review_policy.py"
      - "backend/services/teacher_learning_analytics.py"
      - "scripts/run_browser_e2e.py"
      - "scripts/seed_review_demo.py"
      - "requirements-e2e.txt"
  push:
    branches:
      - main
      - dev
    paths:
      - "frontend/**"
      - "backend/app.py"
      - "backend/services/student_*.py"
      - "backend/services/concept_card_*.py"
      - "backend/services/course_review_policy.py"
      - "backend/services/teacher_learning_analytics.py"
      - "scripts/run_browser_e2e.py"
      - "scripts/seed_review_demo.py"
      - "requirements-e2e.txt"

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      APP_ENV: development
      AI_PROVIDER: none
      AI_PROVIDER_MODE: none
      ALLOW_MOCK_AI: "true"
      ALLOW_LOCAL_HEURISTIC_AI: "true"
      AI_PROVIDER_HEALTHCHECK_ENABLED: "false"
      OCR_PROVIDER: none
      FORMULA_OCR_PROVIDER: none
      AUTH_REQUIRED: "true"
      LOG_REDACT_SECRETS: "true"
      DEEPSEEK_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      MATHPIX_APP_ID: ""
      MATHPIX_APP_KEY: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r requirements-e2e.txt

      - name: Install Chromium runtime
        run: python -m playwright install --with-deps chromium

      - name: Run browser E2E
        run: |
          python scripts/run_browser_e2e.py \
            --json-output /tmp/lexibridge-browser-e2e.json \
            --artifacts /tmp/lexibridge-browser-e2e-artifacts \
            --keep-artifacts

      - name: Upload browser E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lexibridge-browser-e2e-artifacts
          path: |
            /tmp/lexibridge-browser-e2e.json
            /tmp/lexibridge-browser-e2e-artifacts
          if-no-files-found: ignore
