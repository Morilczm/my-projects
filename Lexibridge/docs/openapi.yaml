                type: string
                format: binary
        "402": {description: Export quota or plan restriction, content: {application/json: {schema: {$ref: "#/components/schemas/ApiError"}}}}
        "422": {$ref: "#/components/responses/Error422"}
  /api/student/courses:
    get:
      summary: List courses visible in the student Concept Card view
      description: Returns courses the current user can see under StudentCourseMembership and CourseStudentVisibilityPolicy. It never exposes cards from unauthorized courses.
      responses:
        "200": {description: Visible student courses, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
  /api/student/course-memberships:
    get:
      summary: List student course memberships
      description: Students, teachers, and admins can list their own memberships. Admins may query by user_id. Active memberships are used by the student Concept Card visibility gate.
      parameters:
        - {name: user_id, in: query, schema: {type: integer}}
        - {name: course, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [active, inactive, revoked]}}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
      responses:
        "200": {description: Course membership summaries, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
    post:
      summary: Create or update a student course membership
      description: Admin-only minimal backend API for membership seeding and governance. It does not provide a frontend management UI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, course]
              properties:
                user_id: {type: integer}
                course: {type: string}
                role_in_course: {type: string, enum: [student, teaching_assistant, auditor, teacher, admin]}
                status: {type: string, enum: [active, inactive, revoked]}
      responses:
        "200": {description: Membership created or updated, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
  /api/student/course-memberships/{membership_uid}/revoke:
    post:
      summary: Revoke a student course membership
      description: Admin-only endpoint that marks a membership revoked. Revoked memberships do not grant student Concept Card visibility.
      parameters: [{name: membership_uid, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Membership revoked, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "404": {$ref: "#/components/responses/Error404"}
  /api/course-student-visibility-policies:
    get:
      summary: List course student visibility policies
      description: Teacher/admin backend API for inspecting CourseStudentVisibilityPolicy rows. This task does not add an admin policy UI.
      parameters:
        - {name: course, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [active, disabled]}}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
      responses:
        "200": {description: Visibility policy summaries, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
    post:
      summary: Create or update a course student visibility policy
      description: >
        Admin-only minimal backend API. Default policy semantics are
        conservative: enrolled_only, no auditor view, teacher preview enabled,
        and cross-course search disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [course]
              properties:
                course: {type: string}
                visibility: {type: string, enum: [public, enrolled_only, private, disabled]}
                allow_auditor_view: {type: boolean}
                allow_teacher_preview: {type: boolean}
                allow_cross_course_search: {type: boolean}
                status: {type: string, enum: [active, disabled]}
      responses:
        "200": {description: Visibility policy created or updated, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
  /api/student/progress:
    get:
      summary: Get student learning progress over visible approved Concept Cards
      description: >
        Computes progress only from ConceptAlignmentCards that are both
        status=approved and visible to the current user under course membership
        and CourseStudentVisibilityPolicy. Hidden courses, draft cards,
        needs_review cards, rejected cards, and deprecated cards are excluded.
      parameters:
        - {name: course, in: query, schema: {type: string}}
        - {name: chapter, in: query, schema: {type: string}}
        - {name: include_recent, in: query, schema: {type: boolean}}
      responses:
        "200": {description: Student progress summary, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
  /api/student/concept-cards:
    get:
      summary: List approved ConceptAlignmentCards for student learning
      description: >
        Student-facing Concept Card list. This endpoint is approved-only:
        draft, needs_review, rejected, and deprecated cards are never returned.
        Approved cards are then filtered by StudentCourseMembership and
        CourseStudentVisibilityPolicy, so students only see cards in courses
        they can access or courses explicitly marked public.
        List rows contain summaries, learning state, feedback state, evidence
        counts, and bounded source summaries rather than full evidence text.
      parameters:
        - {name: course, in: query, schema: {type: string}}
        - {name: chapter, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
        - {name: mastered, in: query, schema: {type: boolean}}
        - {name: favorited, in: query, schema: {type: boolean}}
        - {name: has_feedback, in: query, schema: {type: boolean}}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
      responses:
        "200": {description: Approved Concept Card summaries, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
  /api/student/concept-cards/{card_uid}:
    get:
      summary: Get approved ConceptAlignmentCard detail for student learning
      description: Returns bilingual explanations, bounded structured evidence summaries, source information, and the caller's learning state. Non-approved cards or cards from unauthorized courses return 404.
      parameters: [{name: card_uid, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Approved Concept Card detail, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "404": {$ref: "#/components/responses/Error404"}
  /api/student/concept-cards/{card_uid}/state:
    post:
      summary: Update current user's learning state for an approved Concept Card
      description: Updates only StudentConceptCardState for the current user. It cannot modify ConceptAlignmentCard review status.
      parameters: [{name: card_uid, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                favorited: {type: boolean}
                mastered: {type: boolean}
                personal_note: {type: string}
      responses:
        "200": {description: Learning state updated, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "404": {$ref: "#/components/responses/Error404"}
  /api/student/concept-cards/{card_uid}/feedback:
    post:
      summary: Submit student feedback for an approved Concept Card
      description: Creates Feedback linked to the Concept Card UID. Feedback cannot modify the ConceptAlignmentCard status.
      parameters: [{name: card_uid, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                feedback_type: {type: string, enum: [translation_issue, evidence_issue, explanation_unclear, duplicate, other]}
                message: {type: string}
                suggested_chinese_term: {type: string}
      responses:
        "200": {description: Feedback submitted, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "404": {$ref: "#/components/responses/Error404"}
  /api/student/concept-cards/export:
    get:
      summary: Export approved student Concept Cards
      description: Exports only approved cards visible to the current user under course membership and visibility policy. The export excludes internal AuditRecord, provider raw output, review override reasons, and secrets.
      parameters:
        - {name: course, in: query, schema: {type: string}}
        - {name: chapter, in: query, schema: {type: string}}
        - {name: scope, in: query, schema: {type: string, enum: [all, favorited, mastered, unmastered]}}
        - {name: format, in: query, schema: {type: string, enum: [json, csv]}}
      responses:
        "200": {description: JSON export or CSV file, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}, text/csv: {schema: {type: string}}}}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
  /api/student/concept-materials:
    get:
      summary: List governed English materials available for student concept queries
      description: Returns only personal sources owned by the caller and managed-course sources for active memberships.
      responses:
        "200": {description: Accessible material summaries, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
  /api/student/concept-materials/{source_uid}/chunks:
    get:
      summary: Read bounded parsed English chunks for concept selection
      parameters: [{name: source_uid, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Authorized bounded chunks and provenance, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
        "404": {$ref: "#/components/responses/Error404"}
  /api/student/concept-queries:
    post:
      summary: Create or replay a private student ConceptQuery
      description: Validates the selection against the server-side chunk, resolves a workspace-scoped Chinese evidence allow-list, and composes the existing governed Task 12 alignment chain. It never searches published ConceptCards as a substitute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_scope, source_uid, chunk_uid, selected_text, selection_start, selection_end]
              properties:
                workspace_scope: {type: string, enum: [PERSONAL, MANAGED_COURSE]}
                source_uid: {type: string}
                chunk_uid: {type: string}
                selected_text: {type: string, maxLength: 180}
                selection_start: {type: integer, minimum: 0}
                selection_end: {type: integer, minimum: 1}
                request_id: {type: string}
      responses:
        "200": {description: Private non-official student AlignmentResult, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "404": {$ref: "#/components/responses/Error404"}
  /api/student/concept-queries/{query_uid}:
    get:
      summary: Read the caller's private student AlignmentResult
      parameters: [{name: query_uid, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Student-owned AlignmentResult, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
        "404": {$ref: "#/components/responses/Error404"}
  /api/student/concept-queries/{query_uid}/personal-record:
    get:
      summary: Read private learning state for a student AlignmentResult
      parameters: [{name: query_uid, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Caller-owned private learning state, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
        "404": {$ref: "#/components/responses/Error404"}
    put:
      summary: Save private learning state for a student AlignmentResult
      parameters: [{name: query_uid, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
                saved: {type: boolean}
                note: {type: string, maxLength: 4000}
                understanding_state: {type: string, enum: ["", UNDERSTOOD, STILL_CONFUSED]}
                expected_version: {type: integer, minimum: 0}
      responses:
        "200": {description: Private learning state updated, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "404": {$ref: "#/components/responses/Error404"}
        "409": {$ref: "#/components/responses/Error409"}
  /api/student/pilot:
    get:
      summary: Read the optional Personal Workspace pilot contract and caller state
      description: Participation is optional and never required for normal product use. No private learning content is returned.
      responses:
        "200": {description: Pilot contract and caller-owned status, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
  /api/student/pilot/enrollment:
    post:
      summary: Explicitly consent to the optional Personal Workspace pilot
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 120}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pilot_id, consent_version, consent, eligibility_attested]
              properties:
                pilot_id: {type: string}
                consent_version: {type: string}
                consent: {type: boolean}
                eligibility_attested: {type: boolean}
      responses:
        "200": {description: Versioned consent recorded, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
    delete:
      summary: Withdraw consent and erase study sessions and surveys
      description: Withdrawal preserves normal materials, queries and PersonalLearningRecord data.
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 120}}]
      responses:
        "200": {description: Pilot records withdrawn and study sessions erased, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
        "404": {$ref: "#/components/responses/Error404"}
  /api/student/pilot/sessions:
    post:
      summary: Start one consented Personal Workspace pilot session
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 120}}]
      responses:
        "200": {description: Pilot session started, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "409": {$ref: "#/components/responses/Error409"}
  /api/student/pilot/sessions/{session_uid}/complete:
    put:
      summary: Derive content-free task metrics from an owned completed Personal query
      parameters:
        - {name: session_uid, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 120}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query_uid, expected_version]
              properties:
                query_uid: {type: string}
                expected_version: {type: integer, minimum: 1}
      responses:
        "200": {description: Content-free pilot metrics recorded, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "404": {$ref: "#/components/responses/Error404"}
        "409": {$ref: "#/components/responses/Error409"}
  /api/student/pilot/sessions/{session_uid}/survey:
    put:
      summary: Submit the bounded caller-owned post-task survey
      parameters:
        - {name: session_uid, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 120}}
      responses:
        "200": {description: Survey recorded, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "409": {$ref: "#/components/responses/Error409"}
  /api/admin/student-pilot/aggregate:
    get:
      summary: Read small-cell-suppressed deidentified Personal Workspace pilot metrics
      responses:
        "200": {description: Aggregate-only metrics, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
  /api/concept-cards:
    get:
      summary: List Concept Alignment Cards
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: course, in: query, schema: {type: string}}
        - {name: chapter, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
      responses:
        "200": {description: Concept card summaries, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
    post:
      summary: Create a Concept Alignment Card draft manually
      description: Creates a ConceptAlignmentCard draft/needs_review record. It does not auto-approve and does not fabricate confidence_score or final alignment_reason.
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: Concept card created, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "400": {$ref: "#/components/responses/Error400"}
        "403": {$ref: "#/components/responses/Error403"}
  /api/concept-cards/draft-from-evidence:
    post:
      summary: Create Concept Alignment Card draft from bilingual evidence
      description: Creates a needs_review ConceptAlignmentCard from evidence. Candidate Chinese terms remain unverified; the endpoint never approves the card or writes confidence_score.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [english_term]
              properties:
                english_term: {type: string}
                chinese_term: {type: string}
                course: {type: string}
                chapter: {type: string}
                auto_generate_chinese_candidates: {type: boolean}
                evidence_package: {type: object}
      responses:
        "200": {description: Draft Concept Card, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "400": {$ref: "#/components/responses/Error400"}
        "403": {$ref: "#/components/responses/Error403"}
  /api/concept-cards/review-queue:
    get:
      summary: List Concept Alignment Cards available for teacher/admin review
      description: >
        Returns reviewable ConceptAlignmentCard summaries for the caller's
        course-scoped review permissions. Items include card_uid, bilingual
        terms, course/chapter, status, risk_labels, evidence_summary,
        latest_review_summary, assignment_summary, and verification_summary
        when available.
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: course, in: query, schema: {type: string}}
        - {name: chapter, in: query, schema: {type: string}}
        - {name: risk_label, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
      responses:
        "200": {description: Review queue cards, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
  /api/concept-cards/student-feedback-queue:
    get:
      summary: List student feedback linked to Concept Cards for teacher triage
      description: >
        Teacher/admin queue for student Concept Card feedback. Teachers see
        only feedback for courses where they have review permission. Triage
        actions never run automatically from student submissions.
      parameters:
        - {name: course, in: query, schema: {type: string}}
        - {name: chapter, in: query, schema: {type: string}}
        - {name: feedback_type, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [submitted, triaged, linked_to_review, resolved, rejected, duplicate, closed]}}
        - {name: priority, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
      responses:
        "200": {description: Student feedback queue, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
  /api/review-policies:
    get:
      summary: List course review policies
      parameters:
        - {name: course, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
      responses:
        "200": {description: Course review policies, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "403": {$ref: "#/components/responses/Error403"}
    post:
      summary: Create or update a course review policy
      description: Admin-only backend API for configuring course-level review gates. It does not add an admin policy UI.
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: Course review policy saved, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "400": {$ref: "#/components/responses/Error400"}
        "403": {$ref: "#/components/responses/Error403"}
  /api/review-policies/{policy_uid}:
    get:
      summary: Get a course review policy
      parameters: [{name: policy_uid, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Course review policy, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "404": {$ref: "#/components/responses/Error404"}
  /api/review-permissions:
    get:
      summary: List course review permissions
      parameters:
        - {name: course, in: query, schema: {type: string}}
        - {name: reviewer_id, in: query, schema: {type: string}}
        - {name: reviewer_role, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
      responses:
        "200": {description: Course review permissions, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "403": {$ref: "#/components/responses/Error403"}
    post:
      summary: Grant course review permission
      description: Admin-only backend API for course review permissions. Teachers cannot use this to widen their own authority.
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: Course review permission granted, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "400": {$ref: "#/components/responses/Error400"}
        "403": {$ref: "#/components/responses/Error403"}
  /api/review-permissions/{permission_uid}/revoke:
    post:
      summary: Revoke course review permission
      parameters: [{name: permission_uid, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Course review permission revoked, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "403": {$ref: "#/components/responses/Error403"}
        "404": {$ref: "#/components/responses/Error404"}
  /api/concept-cards/student-feedback/{feedback_uid}/triage:
    post:
      summary: Triage student feedback linked to a Concept Card
      description: >
        Teacher/admin endpoint for acknowledging, resolving, rejecting,
        marking duplicate, requesting revision, or reopening a Concept Card
        from student feedback. request_card_revision and reopen_card_for_review
        reuse the Concept Card review workflow and course permission gates.
      parameters: [{name: feedback_uid, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [acknowledge, mark_resolved, mark_duplicate, reject_feedback, request_card_revision, reopen_card_for_review, link_to_existing_review, add_teacher_note]
                reason_code: {type: string}
                teacher_note: {type: string}
                required_changes: {type: array, items: {type: string}}
                linked_review_uid: {type: string}
      responses:
        "200": {description: Feedback triaged, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "404": {$ref: "#/components/responses/Error404"}
  /api/teacher/learning-analytics:
    get:
      summary: Get aggregate teacher learning analytics
      description: >
        Aggregates approved ConceptAlignmentCards, student learning states,
        and student feedback for courses the teacher/admin is allowed to
        review. Draft, needs_review, rejected, and deprecated cards are
        excluded. The response is aggregate-only and does not include student
        personal identifiers, AuditRecord payloads, provider raw output, or
        review override reasons.
      parameters:
        - {name: course, in: query, schema: {type: string}}
        - {name: chapter, in: query, schema: {type: string}}
        - {name: include_cards, in: query, schema: {type: boolean}}
        - {name: include_feedback_hotspots, in: query, schema: {type: boolean}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200": {description: Course learning analytics, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
  /api/teacher/learning-analytics/cards:
    get:
      summary: List card-level teacher learning analytics
      description: >
        Returns card-level aggregate metrics for approved cards in courses
        the current teacher/admin may review. priority_hint is a deterministic
        rule-based hint, not an AI judgment.
      parameters:
        - {name: course, in: query, schema: {type: string}}
        - {name: chapter, in: query, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string, enum: [feedback_count, mastery_rate, unmastered, updated_at]}}
        - {name: q, in: query, schema: {type: string}}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
      responses:
        "200": {description: Card analytics rows, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
  /api/teacher/learning-analytics/export:
    get:
      summary: Export teacher learning analytics report
      description: >
        Exports aggregate card-level analytics as csv or json. The report
        excludes student personal data, AuditRecord, provider raw output,
        review override reasons, Authorization, Cookie, and API keys.
      parameters:
        - {name: course, in: query, schema: {type: string}}
        - {name: chapter, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string, enum: [feedback_count, mastery_rate, unmastered, updated_at]}}
        - {name: format, in: query, schema: {type: string, enum: [csv, json]}}
      responses:
        "200": {description: JSON export or CSV file, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}, text/csv: {schema: {type: string}}}}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
