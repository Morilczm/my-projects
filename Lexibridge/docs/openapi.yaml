  /api/alignment/run:
    post:
      summary: Run terminology alignment for a document or direct term
      deprecated: true
      description: >
        Legacy active compatibility endpoint. Under the API root, the
        supported replacement is POST document-alignment-runs, followed by
        GET document-alignment-runs/{run_uid} and
        GET document-alignment-runs/{run_uid}/items. The production teacher
        workflow uses that formal API and does not fall back to this operation.
        External/live execution is disabled in this path and returns
        LEGACY_ALIGNMENT_EXTERNAL_EXECUTION_DISABLED. Only explicitly
        allowlisted local deterministic compatibility modes may continue.
        This endpoint is not HTTP 410 until the external-consumer observation
        window, legacy queue drain, worker shutdown procedure, migration
        notice, and rollback ownership are complete. A later approved
        zero-caller phase will use LEGACY_ALIGNMENT_RUN_DEPRECATED. Operators
        may disable new compatibility admission with
        LEGACY_ALIGNMENT_ROUTE_ADMISSION_ENABLED=false; that maintenance state
        returns 503 LEGACY_ALIGNMENT_ADMISSION_DISABLED without creating a run
        or job and is reversible independently of the formal workflow. The
        server runtime states ACTIVE, FREEZE, DRAINING, and DISABLED preserve
        history reads while separating creation, controlled queue drain, and
        worker shutdown. FREEZE deployment starts observation preparation; it
        is not HTTP 410 and does not remove this operation. The required
        target-environment observation window remains pending until at least
        14 continuous days, five operating days, zero new Legacy creation, and
        external-consumer evidence are recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                document_id: {type: integer}
                english_term: {type: string}
                course_id: {type: integer}
                scope_type: {type: string}
      responses:
        "200": {description: Alignment result and card, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "400": {$ref: "#/components/responses/Error400"}
        "403": {$ref: "#/components/responses/Error403"}
        "503": {description: Legacy alignment admission is disabled for maintenance, content: {application/json: {schema: {$ref: "#/components/schemas/ApiError"}}}}
  /api/alignment/runs:
    get:
      summary: List visible alignment runs
      parameters:
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
      responses:
        "200": {description: Alignment runs, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
  /api/alignment/runs/{run_id}:
    get:
      summary: Get alignment run detail
      parameters:
        - name: run_id
          in: path
          required: true
          schema: {type: integer}
      responses:
