        "403": {$ref: "#/components/responses/Error403"}
        "404": {$ref: "#/components/responses/Error404"}
  /api/concept-cards/{card_uid}/review:
    post:
      summary: Submit a teacher/admin Concept Card review action
      description: >
        Records approve/reject/revision/more-evidence/reopen/deprecate review
        actions through the backend policy and permission gate. Blocking-risk
        or course-policy failures return stable JSON with request_id and
        details.audit_error_code.
      parameters: [{name: card_uid, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string}
                reason_code: {type: string}
                review_comment: {type: string}
                required_changes: {type: array, items: {type: string}}
                resolved_risk_labels: {type: array, items: {type: string}}
                allow_risk_override: {type: boolean}
                override_reason: {type: string}
      responses:
        "200": {description: Review action recorded, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "404": {$ref: "#/components/responses/Error404"}
