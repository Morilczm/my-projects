openapi: 3.0.3
info:
  title: LexiBridge AI Local MVP API
  version: 0.8.12-task13b
  description: >
    OpenAPI contract for LexiBridge AI Local MVP, an AI-powered bilingual
    course knowledge alignment platform. This contract documents the local
    Flask + SQLite demo API and its security/error behavior.
servers:
  - url: http://127.0.0.1:5000
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    ApiSuccess:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        message:
          type: string
        request_id:
          type: string
        data:
          type: object
    ApiError:
      type: object
      required: [status, error_code, message]
      properties:
        status:
          type: string
          enum: [error]
        error_code:
          type: string
          enum:
            - AUTH_REQUIRED
            - TOKEN_EXPIRED
            - PERMISSION_DENIED
            - RESOURCE_NOT_FOUND
            - VALIDATION_ERROR
            - FILE_TOO_LARGE
            - UNSUPPORTED_FILE_TYPE
            - OCR_UNAVAILABLE
            - FORMULA_OCR_UNAVAILABLE
            - PARSING_FAILED
            - QUOTA_EXCEEDED
            - AI_PROVIDER_FAILED
            - AI_PROVIDER_NOT_CONFIGURED
            - LEGACY_ALIGNMENT_EXTERNAL_EXECUTION_DISABLED
            - LEGACY_ALIGNMENT_ADMISSION_DISABLED
            - AI_INVALID_RESPONSE
            - PDF_FONT_UNAVAILABLE
            - TOO_MANY_REQUESTS
            - INTERNAL_ERROR
            - DOCUMENT_ALIGNMENT_INVALID_REQUEST
            - DOCUMENT_ALIGNMENT_UNSUPPORTED_MEDIA_TYPE
            - DOCUMENT_ALIGNMENT_SOURCE_NOT_AVAILABLE
            - DOCUMENT_ALIGNMENT_SOURCE_NOT_GOVERNED
            - DOCUMENT_ALIGNMENT_PARSE_BLOCKED
            - DOCUMENT_ALIGNMENT_NO_USABLE_CHUNKS
            - DOCUMENT_ALIGNMENT_IDEMPOTENCY_CONFLICT
            - DOCUMENT_ALIGNMENT_PERSISTENCE_ERROR
            - DOCUMENT_ALIGNMENT_QUERY_INVALID_REQUEST
            - DOCUMENT_ALIGNMENT_WORKFLOW_NOT_FOUND
            - DOCUMENT_ALIGNMENT_QUERY_PERSISTENCE_ERROR
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          description: Error details may include audit_error_code for review policy, permission, and validation failures.
    DocumentAlignmentWorkflowRun:
      type: object
      required: [run_uid, workflow_version, status, stage, source_uid, progress_percent, is_terminal]
      properties:
        run_uid: {type: string, maxLength: 64}
        workflow_version: {type: string, enum: [formal-document-alignment-v1]}
        status:
          type: string
          enum: [queued, validating, processing, ready_for_review, completed_with_warnings, blocked, failed]
        stage:
          type: string
          enum: [queued, source_validation, term_extraction, evidence_retrieval, draft_creation, verification, finalization, terminal]
        source_uid: {type: string, maxLength: 64}
        source_title: {type: string}
        source_filename: {type: string}
        course: {type: string}
        chapter: {type: string}
        requested_by: {type: string}
        created_at: {type: string}
        started_at: {type: string}
        finished_at: {type: string}
        total_items: {type: integer, minimum: 0}
        ready_for_review_items: {type: integer, minimum: 0}
        blocked_items: {type: integer, minimum: 0}
        failed_items: {type: integer, minimum: 0}
        warning_count: {type: integer, minimum: 0}
        progress_percent: {type: integer, minimum: 0, maximum: 100}
        safe_error_code: {type: string}
        safe_error_message: {type: string, maxLength: 500}
        consistency_warnings:
          type: array
          items: {type: string}
        is_terminal: {type: boolean}
        can_view_items: {type: boolean}
        can_review_results: {type: boolean}
    DocumentAlignmentWorkflowItem:
      type: object
      required: [item_uid, candidate_term, normalized_term, status, stage, source_chunk_count, risk_labels, retry_count, is_terminal, is_reviewable]
      properties:
        item_uid: {type: string, maxLength: 64}
        candidate_term: {type: string}
        normalized_term: {type: string}
        status:
          type: string
          enum: [candidate, evidence_ready, draft_created, verification_completed, needs_review, blocked, failed]
        stage: {type: string}
        source_chunk_count: {type: integer, minimum: 0}
        risk_labels:
          type: array
          items: {type: string}
        draft_card_uid: {type: string, nullable: true}
        verification_run_uid: {type: string, nullable: true}
        confidence_score: {type: number, nullable: true}
        confidence_summary: {type: object, nullable: true}
        recommendation: {type: string, nullable: true}
        safe_error_code: {type: string}
        safe_error_message: {type: string, maxLength: 500}
        retry_count: {type: integer, minimum: 0}
        created_at: {type: string}
        updated_at: {type: string}
        consistency_warnings:
          type: array
          items: {type: string}
        is_terminal: {type: boolean}
        is_reviewable: {type: boolean}
    DocumentAlignmentWorkflowItemPage:
      type: object
      required: [workflow_run_uid, items, pagination]
      properties:
        workflow_run_uid: {type: string, maxLength: 64}
        items:
          type: array
          items: {$ref: "#/components/schemas/DocumentAlignmentWorkflowItem"}
        pagination:
          type: object
          required: [page, page_size, total_items, total_pages, has_next, has_previous]
          properties:
            page: {type: integer, minimum: 1}
            page_size: {type: integer, minimum: 1, maximum: 100}
            total_items: {type: integer, minimum: 0}
            total_pages: {type: integer, minimum: 0}
            has_next: {type: boolean}
            has_previous: {type: boolean}
    Pagination:
      type: object
      required: [page, page_size, total, has_next]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        has_next:
          type: boolean
    User:
      type: object
      properties:
        id: {type: integer}
        username: {type: string}
        email: {type: string}
        role: {type: string, enum: [student, teacher, admin]}
        is_verified: {type: boolean}
    Course:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        course_name: {type: string}
        course_code: {type: string}
        semester: {type: string}
        teacher_id: {type: integer}
    Document:
      type: object
      properties:
        id: {type: integer}
        owner_user_id: {type: integer}
        course_id: {type: integer, nullable: true}
        scope_type: {type: string, enum: [global, course, personal]}
        filename: {type: string}
        file_type: {type: string}
        parsing_status: {type: string}
        ocr_status: {type: string}
        ocr_provider: {type: string}
        file_sha256: {type: string}
        storage_object_id: {type: integer, nullable: true}
        storage_backend: {type: string}
        storage_key: {type: string}
        original_filename: {type: string}
        content_type: {type: string}
        size_bytes: {type: integer}
        sha256: {type: string}
    StorageObject:
      type: object
      properties:
        id: {type: integer}
        storage_backend: {type: string}
        bucket: {type: string}
        storage_key: {type: string}
        original_filename: {type: string}
        content_type: {type: string}
        size_bytes: {type: integer}
        sha256: {type: string}
        owner_user_id: {type: integer, nullable: true}
        course_id: {type: integer, nullable: true}
        document_id: {type: integer, nullable: true}
        visibility: {type: string, enum: [private, course, admin, public_demo]}
        purpose: {type: string}
        status: {type: string}
    AIProviderConfig:
      type: object
      properties:
        id: {type: integer}
        provider_name: {type: string}
        provider_mode: {type: string, enum: [none, mock, local_heuristic, live]}
        default_model: {type: string}
        is_enabled: {type: boolean}
        is_default: {type: boolean}
        health_status: {type: string, enum: [healthy, degraded, unhealthy, unknown]}
        last_healthcheck_at: {type: string}
    AIModelRegistry:
      type: object
      properties:
        id: {type: integer}
        provider_name: {type: string}
        model_name: {type: string}
        model_version: {type: string}
        provider_mode: {type: string}
        is_enabled: {type: boolean}
        is_default_for_provider: {type: boolean}
        last_evaluation_run_id: {type: integer, nullable: true}
        last_evaluation_score: {type: number}
    PromptTemplate:
      type: object
      properties:
        id: {type: integer}
        prompt_key: {type: string}
        prompt_version: {type: string}
        task_type: {type: string}
        language: {type: string}
        json_schema: {type: object}
        is_active: {type: boolean}
        is_default: {type: boolean}
    AICallLog:
      type: object
      properties:
        id: {type: integer}
        task_type: {type: string}
        provider_name: {type: string}
        provider_mode: {type: string}
        model_name: {type: string}
        prompt_key: {type: string}
        prompt_version: {type: string}
        request_hash: {type: string}
        response_hash: {type: string}
        input_token_count: {type: integer}
        output_token_count: {type: integer}
        estimated_cost: {type: number}
        latency_ms: {type: integer}
        status: {type: string}
        error_code: {type: string}
        redacted_prompt_preview: {type: string}
        redacted_response_preview: {type: string}
    DocumentChunk:
      type: object
      properties:
        id: {type: integer}
        document_id: {type: integer}
        content: {type: string}
        language: {type: string}
        page_number: {type: integer, nullable: true}
        slide_number: {type: integer, nullable: true}
        ocr_confidence: {type: number}
    Evidence:
      type: object
      properties:
        chunk_id: {type: integer}
        source_title: {type: string}
        language: {type: string}
        course_id: {type: integer, nullable: true}
        knowledge_base_type: {type: string}
        visibility: {type: string}
        content_excerpt: {type: string}
        source_citation: {type: string}
        page_number: {type: integer, nullable: true}
        evidence_score: {type: number}
        evidence_strength: {type: string}
        score_breakdown: {type: object}
        risk_flags:
          type: array
          items: {type: string}
        retrieval_backend: {type: string}
        retrieval_version: {type: string}
        index_version: {type: string}
        lexical_score: {type: number, nullable: true}
        vector_score: {type: number, nullable: true}
        hybrid_score: {type: number, nullable: true}
        rerank_score: {type: number, nullable: true}
    AlignmentRun:
      type: object
      properties:
        id: {type: integer}
        document_id: {type: integer, nullable: true}
        course_id: {type: integer, nullable: true}
        status: {type: string}
        term_count: {type: integer}
        card_created_count: {type: integer}
        auto_approved_count: {type: integer}
        qc_count: {type: integer}
        needs_evidence_count: {type: integer}
        failed_count: {type: integer}
        started_at: {type: string}
        finished_at: {type: string}
    TerminologyCard:
      type: object
      properties:
        id: {type: integer}
        scope_type: {type: string, enum: [course, personal]}
        course_id: {type: integer, nullable: true}
        owner_user_id: {type: integer, nullable: true}
        english_term: {type: string}
        final_chinese_term: {type: string}
        alignment_status: {type: string}
        status: {type: string}
        confidence_score: {type: integer}
        english_evidence_snapshot: {type: array, items: {type: object}}
        chinese_evidence_snapshot: {type: array, items: {type: object}}
        score_breakdown: {type: object}
        quality_flags: {type: array, items: {type: string}}
        ai_provider: {type: string}
        ai_model: {type: string}
        prompt_version: {type: string}
        retrieval_version: {type: string}
        source_alignment_run_id: {type: integer, nullable: true}
    EvaluationRun:
      type: object
      properties:
        id: {type: integer}
        evaluation_set_id: {type: integer}
        status: {type: string}
        metrics: {type: object}
        report_json: {type: object}
        report_markdown: {type: string}
    PilotFeedback:
      type: object
      properties:
        id: {type: integer}
        feedback_type: {type: string}
        feedback_source: {type: string}
        severity: {type: string, enum: [low, medium, high, critical]}
        status: {type: string}
        priority: {type: string}
        course_id: {type: integer, nullable: true}
        terminology_card_id: {type: integer, nullable: true}
        english_term: {type: string}
        chinese_term: {type: string}
        reported_issue: {type: string}
        expected_result: {type: string}
        actual_result: {type: string}
        evidence_comment: {type: string}
        classification: {type: string}
        root_cause: {type: string}
        resolution_action: {type: string}
        resolution_note: {type: string}
        student_display: {type: string}
        converted_to_evaluation_item_id: {type: integer, nullable: true}
        linked_backlog_item_id: {type: integer, nullable: true}
        created_at: {type: string}
        updated_at: {type: string}
        resolved_at: {type: string, nullable: true}
    IterationBacklogItem:
      type: object
      properties:
        id: {type: integer}
        title: {type: string}
        description: {type: string}
        source_type: {type: string}
        source_feedback_id: {type: integer, nullable: true}
        course_id: {type: integer, nullable: true}
        severity: {type: string}
        priority: {type: string, enum: [P0, P1, P2, P3]}
        category: {type: string}
        status: {type: string}
        owner: {type: string}
        target_pr: {type: string}
        acceptance_criteria: {type: string}
        created_at: {type: string}
        updated_at: {type: string}
        closed_at: {type: string, nullable: true}
    BackgroundJob:
      type: object
      properties:
        id: {type: integer}
        job_type: {type: string, enum: [document_ingestion, alignment_run, evaluation_run]}
        status: {type: string, enum: [queued, running, completed, failed, canceled, retrying]}
        priority: {type: integer}
        created_by: {type: integer}
        course_id: {type: integer, nullable: true}
        document_id: {type: integer, nullable: true}
        alignment_run_id: {type: integer, nullable: true}
        evaluation_run_id: {type: integer, nullable: true}
        scope_type: {type: string}
        owner_user_id: {type: integer, nullable: true}
        progress_current: {type: integer}
        progress_total: {type: integer}
        progress_percent: {type: integer}
        progress_message: {type: string}
        error_code: {type: string}
        error_message: {type: string}
        attempt_count: {type: integer}
        max_attempts: {type: integer}
        created_at: {type: string}
        started_at: {type: string}
        finished_at: {type: string}
    BackgroundJobEvent:
      type: object
      properties:
        id: {type: integer}
        job_id: {type: integer}
        event_type: {type: string}
        message: {type: string}
        progress_current: {type: integer}
        progress_total: {type: integer}
        metadata: {type: object}
        created_at: {type: string}
  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, default: 1}
    PageSize:
      name: page_size
      in: query
      schema: {type: integer, default: 20}
  responses:
    Error400:
      description: Validation error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    Error401:
      description: Authentication required or token expired
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    Error403:
      description: Permission denied
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    Error404:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    Error422:
      description: Unprocessable document or local dependency unavailable
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    Error409:
      description: Idempotency or state conflict
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    Error415:
      description: JSON content type required
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    Error500:
      description: Safe internal or persistence failure
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
paths:
  /api/document-alignment-runs:
    post:
      operationId: create_document_alignment_run
      summary: Start an asynchronous formal document alignment workflow
      description: Teachers and administrators may start a workflow from a governed source. Students are denied. Processing occurs asynchronously.
      security: [{bearerAuth: []}]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_uid]
              properties:
                source_uid: {type: string, minLength: 1, maxLength: 64}
            example: {source_uid: source-uid}
      responses:
        "202":
          description: Workflow accepted or idempotently reused
          headers:
            Location:
              description: Canonical workflow status URL
              schema: {type: string}
            Retry-After:
              description: Suggested polling interval in seconds
              schema: {type: integer, enum: [2]}
            X-Request-ID:
              description: Safe request correlation identifier
              schema: {type: string}
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/ApiSuccess"}
                  - type: object
                    properties:
                      data:
                        allOf:
                          - {$ref: "#/components/schemas/DocumentAlignmentWorkflowRun"}
                          - type: object
                            required: [reused, status_url, items_url]
                            properties:
                              reused: {type: boolean}
                              status_url: {type: string}
                              items_url: {type: string}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "404": {$ref: "#/components/responses/Error404"}
        "409": {$ref: "#/components/responses/Error409"}
        "415": {$ref: "#/components/responses/Error415"}
        "422": {$ref: "#/components/responses/Error422"}
        "500": {$ref: "#/components/responses/Error500"}
  /api/document-alignment-runs/{run_uid}:
    get:
      operationId: get_document_alignment_run
      summary: Get a formal document alignment workflow business status
      description: Available to administrators and authorized teachers. Students are denied. Transport ownership details are not returned.
      security: [{bearerAuth: []}]
      parameters:
        - name: run_uid
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 64}
      responses:
        "200":
          description: Safe workflow status
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/ApiSuccess"}
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/DocumentAlignmentWorkflowRun"}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "404": {$ref: "#/components/responses/Error404"}
        "500": {$ref: "#/components/responses/Error500"}
  /api/document-alignment-runs/{run_uid}/items:
    get:
      operationId: list_document_alignment_run_items
      summary: List a formal workflow's safe item summaries
      description: Results are database-paginated and visible only to administrators and authorized teachers. Students are denied.
      security: [{bearerAuth: []}]
      parameters:
        - name: run_uid
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 64}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: status
          in: query
          schema:
            type: string
            enum: [candidate, evidence_ready, draft_created, verification_completed, needs_review, blocked, failed]
        - name: reviewable_only
          in: query
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: Safe paginated workflow item summaries
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/ApiSuccess"}
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/DocumentAlignmentWorkflowItemPage"}
        "400": {$ref: "#/components/responses/Error400"}
        "401": {$ref: "#/components/responses/Error401"}
        "403": {$ref: "#/components/responses/Error403"}
        "404": {$ref: "#/components/responses/Error404"}
        "500": {$ref: "#/components/responses/Error500"}
  /api/auth/register:
    post:
      security: []
      summary: Register a student account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: {type: string}
                email: {type: string}
                password: {type: string}
      responses:
        "200": {description: Registered, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "400": {$ref: "#/components/responses/Error400"}
  /api/auth/login:
    post:
      security: []
      summary: Login and receive bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string}
                password: {type: string}
      responses:
        "200": {description: Token and user, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
  /api/auth/logout:
    post:
      summary: Revoke current bearer token
      responses:
        "200": {description: Logged out, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
  /api/auth/verify-email:
    post:
      security: []
      summary: Verify account email with local mock code or token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        "200": {description: Email verified, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "400": {$ref: "#/components/responses/Error400"}
  /api/auth/password-reset/request:
    post:
      security: []
      summary: Request a local mock password reset code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string}
      responses:
        "200": {description: Reset code generated, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "400": {$ref: "#/components/responses/Error400"}
  /api/auth/password-reset/confirm:
    post:
      security: []
      summary: Confirm password reset with local mock code or token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string}
                password: {type: string}
      responses:
        "200": {description: Password reset completed, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "400": {$ref: "#/components/responses/Error400"}
  /api/auth/me:
    get:
      summary: Return current user
      parameters:
        - {$ref: "#/components/parameters/Page"}
      responses:
        "200": {description: Current user, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "401": {$ref: "#/components/responses/Error401"}
  /api/courses:
    get:
      summary: List courses
      parameters:
        - {$ref: "#/components/parameters/Page"}
