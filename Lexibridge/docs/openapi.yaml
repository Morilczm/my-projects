                attach_to_card: {type: boolean}
                english_term: {type: string}
                chinese_term: {type: string}
                course: {type: string}
                chapter: {type: string}
                english_evidence: {type: array, items: {type: object}}
                chinese_evidence: {type: array, items: {type: object}}
                fake_response_type: {type: string}
                replay_response_type: {type: string}
      responses:
        "200": {description: Verification run result, content: {application/json: {schema: {$ref: "#/components/schemas/ApiSuccess"}}}}
        "400": {$ref: "#/components/responses/Error400"}
        "403": {$ref: "#/components/responses/Error403"}
