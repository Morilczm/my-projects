"$schema" = "node_modules/wrangler/config-schema.json"
name = "byrdocs"
main = "worker/index.ts"
compatibility_date = "2025-08-31"

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[durable_objects.bindings]]
name = "OAUTH"
class_name = "OAuth"

[[migrations]]
tag = "v1"
new_sqlite_classes = [
    "Counter",
    "OAuth",
]

[observability]
enabled = true

[vars]
OSS_ENDPOINT = "https://oss-cn-beijing.aliyuncs.com"
OSS_REGION = "cn-beijing"
OSS_FILE_BUCKET = "byrdocs-file"
OSS_DATA_BUCKET = "byrdocs-data"

[[analytics_engine_datasets]]
binding = "AE"
dataset = "byrdocs"

[triggers]
crons = ["0 0 * * *"]

[assets]
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = [
    "/",
    "/api/*",
    "/schema/*",
    "/data/*",
    "/files/*",
    "/sitemap.xml",
]

[[d1_databases]]
binding = "DB"
database_name = "byrdocs"
database_id = "ac16ab3a-5112-4da1-9635-8f995738144c"
